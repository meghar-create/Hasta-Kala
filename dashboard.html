<!doctype html><html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard · Hasta-Kala</title><link rel="icon" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/store.css"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head><body><main id="app" class="max-w-6xl mx-auto p-4 w-full"></main><script>
boot(async(U,A)=>{if(!guard(U,['owner']))return;
let range=localStorage.hk_dr||'30';
const RANGES=[['7','7 days'],['30','30 days'],['90','90 days'],['365','1 year'],['all','All time']];
const draw0=async()=>{
const days=range=='all'?null:+range,start=days?addDays(startOfDay(),-(days-1)):null,pstart=days?addDays(start,-days):null,from=pstart||start;
const cnt=(f)=>f(sb.from('orders').select('id',{count:'exact',head:true}).eq('shop_id',U.shop)).then(r=>r.count||0);
const[sh,orders,toPack,toTrack,refunds,low,oos]=await Promise.all([
 sb.from('shops').select('*,plans(*)').eq('id',U.shop).single().then(must),
 fetchAll((a,b)=>{let q=sb.from('orders').select('id,total,discount,delivery_fee,channel,status,payment_status,payment_method,fulfilment,created_at,sold_by_name,sold_by_role,commission_amt,order_items(name,qty,price)').eq('shop_id',U.shop);if(from)q=q.gte('created_at',from.toISOString());return q.order('id').range(a,b)}),
 cnt(q=>q.eq('channel','online').eq('status','placed')),
 cnt(q=>q.eq('channel','online').eq('fulfilment','delivery').in('status',['packed','shipped']).is('tracking_no',null)),
 cnt(q=>q.eq('payment_status','refund_due')),
 sb.from('products').select('id,name,stock').eq('shop_id',U.shop).gt('stock',0).lte('stock',5).order('stock').limit(8).then(must),
 sb.from('products').select('id',{count:'exact',head:true}).eq('shop_id',U.shop).eq('stock',0).then(r=>r.count||0)]);
const live=sh.approved&&sh.sub_status!='suspended'&&(+sh.plans.price==0||new Date(sh.sub_expires_at)>new Date()),dleft=Math.ceil((new Date(sh.sub_expires_at)-new Date())/864e5);
const inCur=o=>!start||new Date(o.created_at)>=start,inPrev=o=>pstart&&new Date(o.created_at)>=pstart&&new Date(o.created_at)<start;
const cur=orders.filter(inCur),prev=orders.filter(inPrev);
const stat=L=>{const ok=L.filter(o=>o.status!='cancelled'),er=ok.filter(earnedOrder),rev=er.reduce((a,o)=>a+ +o.total,0),cm=er.reduce((a,o)=>a+ +(o.commission_amt||0),0);
 return{ok,er,rev,n:er.length,aov:er.length?rev/er.length:0,items:er.reduce((a,o)=>a+o.order_items.reduce((x,i)=>x+i.qty,0),0),on:er.filter(o=>o.channel=='online').reduce((a,o)=>a+ +o.total,0),pos:er.filter(o=>o.channel=='pos').reduce((a,o)=>a+ +o.total,0),cm,net:rev-cm,canc:L.filter(o=>o.status=='cancelled').length,pend:ok.filter(o=>!earnedOrder(o)&&o.payment_status!='refund_due').reduce((a,o)=>a+ +o.total,0)}};
const c=stat(cur),p=stat(prev),cmp=!!days,dt=(a,b,i)=>cmp?' '+deltaTag(a,b,i):'';
/* trend buckets: daily up to 31 bars, weekly up to ~4 months, monthly beyond */
const first=days?start:new Date(Math.min(...cur.map(o=>+new Date(o.created_at)),+new Date())),span=Math.max(1,Math.ceil((startOfDay()-startOfDay(first))/864e5)+1),mode=span<=31?'d':span<=130?'w':'m';
const key=d=>{d=new Date(d);if(mode=='d')return ymd(d);if(mode=='w'){const x=startOfDay(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)}return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const buckets=new Map();{let x=startOfDay(first);if(mode=='w')x.setDate(x.getDate()-((x.getDay()+6)%7));if(mode=='m')x.setDate(1);const end=startOfDay();while(x<=end){buckets.set(key(x),{l:mode=='m'?x.toLocaleDateString('en-IN',{month:'short',year:'2-digit'}):x.toLocaleDateString('en-IN',{day:'numeric',month:'short'}),v:[0,0]});if(mode=='d')x.setDate(x.getDate()+1);else if(mode=='w')x.setDate(x.getDate()+7);else x.setMonth(x.getMonth()+1)}}
c.er.forEach(o=>{const b=buckets.get(key(o.created_at));if(b)b.v[o.channel=='pos'?0:1]+=+o.total});
const hrs=Array.from({length:24},(_,h)=>({l:String(h),v:[0]})),wk=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(l=>({l,v:[0]}));
c.er.forEach(o=>{const t=new Date(o.created_at);hrs[t.getHours()].v[0]+=+o.total;wk[(t.getDay()+6)%7].v[0]+=+o.total});
const top={},qty={};c.er.forEach(o=>o.order_items.forEach(i=>{top[i.name]=(top[i.name]||0)+i.qty*i.price;qty[i.name]=(qty[i.name]||0)+i.qty}));
const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([l,v])=>({l,v,s:qty[l]+' sold'})),tq=Object.entries(qty).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([l,v])=>({l,v}));
const ppl={};c.er.forEach(o=>{const k=o.channel=='pos'?(o.sold_by_name?o.sold_by_name+' ('+(o.sold_by_role=='owner'?'Owner':'Staff')+')':'Counter (unknown)'):'Online orders';(ppl[k]=ppl[k]||{n:0,v:0}).n++;ppl[k].v+=+o.total});
const pe=Object.entries(ppl).sort((a,b)=>b[1].v-a[1].v).map(([l,x])=>({l,v:x.v,s:x.n+' bill'+(x.n>1?'s':'')+' · avg '+inr(x.v/x.n)}));
const pm={};c.er.forEach(o=>{const k=o.channel=='pos'?o.payment_method:(o.payment_method=='Online'?'Online (UPI/Card)':o.fulfilment=='pickup'?'Pay at store':'Cash on delivery');pm[k]=(pm[k]||0)+ +o.total});
const ty={};c.er.forEach(o=>{const k=ordType(o)[0];ty[k]=(ty[k]||0)+ +o.total});
const rows=m=>Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v}));
const alerts=[];if(!live)alerts.push(['t-bad','circle-alert',!sh.approved?'Your shop is waiting for approval by Hasta-Kala.':sh.sub_status=='suspended'?'Your shop is suspended. Contact support.':'Your paid plan has expired, so customers cannot see your store.',!sh.approved||sh.sub_status=='suspended'?'':'<a href="/plans" class="underline">Renew now</a>']);
if(live&&+sh.plans.price>0&&dleft<=7)alerts.push(['','clock','Your '+sh.plans.name+' plan ends in '+Math.max(dleft,0)+' day'+(dleft==1?'':'s')+'.','<a href="/plans" class="underline">Renew</a>']);
if(toPack)alerts.push(['','package',toPack+' new online order'+(toPack>1?'s':'')+' waiting to be packed.','<a href="/sales" class="underline">Open sales</a>']);
if(toTrack)alerts.push(['','truck',toTrack+' delivery order'+(toTrack>1?'s':'')+' without a tracking number.','<a href="/sales" class="underline">Add tracking</a>']);
if(refunds)alerts.push(['t-bad','banknote',refunds+' order'+(refunds>1?'s':'')+' need a refund (customer paid but the order was cancelled).','<a href="/sales" class="underline">View</a>']);
if(oos)alerts.push(['','boxes',oos+' product'+(oos>1?'s are':' is')+' out of stock.','<a href="/inventory" class="underline">Restock</a>']);
if(!sh.pincode&&sh.delivery_enabled!==false)alerts.push(['','map-pin','Add your pincode so delivery fees work for customers.','<a href="/delivery" class="underline">Set up delivery</a>']);
A.innerHTML=`<div class="rounded-lg p-4 mb-4 ${live?'t-ok':'t-bad'}"><b>${esc(sh.name)}</b> · ${live?'LIVE':!sh.approved?'Awaiting approval by Hasta-Kala':'Not live'} · Plan: <a href="/plans" class="underline">${esc(sh.plans.name)}</a> (${inr(sh.plans.price)}/mo · <b>${sh.plans.commission_pct}% commission</b> on online orders only)${+sh.plans.price>0?' · valid till '+esc(day(sh.sub_expires_at)):''}</div>
<div class="flex items-center justify-between gap-2 flex-wrap mb-3"><h1 class="text-xl font-bold">Dashboard</h1>${chips('range',RANGES,range)}</div>
${alerts.length?`<div class="mb-4"><h2 class="font-bold mb-2">Needs your attention</h2>${alerts.map(a=>`<div class="alert-row ${a[0]}"><span class="flex gap-2 items-center"><i data-lucide="${a[1]}" class="w-4 h-4 shrink-0"></i>${esc(a[2])}</span>${a[3]}</div>`).join('')}</div>`:''}
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-2">${kpi('Sales received',inr(c.rev)+dt(c.rev,p.rev),cmp?'vs '+inr(p.rev)+' previous '+days+' days':'','Paid orders plus delivered cash-on-delivery / pay-at-store orders. Cancelled orders are never counted.')}${kpi('Orders',c.n+dt(c.n,p.n),c.canc?c.canc+' cancelled':'')}${kpi('Average order value',inr(Math.round(c.aov))+dt(c.aov,p.aov))}${kpi('Items sold',c.items+dt(c.items,p.items))}
${kpi('Counter sales',inr(c.pos)+dt(c.pos,p.pos))}${kpi('Online sales',inr(c.on)+dt(c.on,p.on))}${kpi('Hasta-Kala commission',inr(c.cm)+dt(c.cm,p.cm,1),'online orders only · <a href="/plans" class="underline">details</a>','Commission is charged only on online orders, on the item total after coupons, at your plan rate when the order was placed.')}${kpi('Your earnings after commission',inr(c.net),'sales received − commission')}</div>
<p class="text-xs mute mb-4">Pending (placed but not yet paid or delivered): <b>${inr(c.pend)}</b>. Commission is not charged on counter sales or on delivery fees.</p>
<div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-2">Sales trend <span class="text-xs mute font-normal">${mode=='d'?'per day':mode=='w'?'per week':'per month'}</span></h2>${c.er.length?barChart([...buckets.values()],[{n:'Counter',c:'var(--gold)'},{n:'Online',c:'var(--clay)'}]):'<p class="text-sm mute">No sales in this period yet. Make a bill on the Billing page to see your chart come alive.</p>'}</div>
<div class="grid md:grid-cols-2 gap-4 mb-4"><div class="surf rounded-lg p-4"><h2 class="font-bold mb-2">Top products by revenue</h2>${hBars(tp)}</div><div class="surf rounded-lg p-4"><h2 class="font-bold mb-2">Best sellers by quantity</h2>${hBars(tq,n=>n+' sold')}</div></div>
<div class="grid md:grid-cols-2 gap-4 mb-4"><div class="surf rounded-lg p-4"><h2 class="font-bold mb-1">Who made the sales</h2><p class="text-xs mute mb-2">Counter bills by the person who made them, plus online orders.</p>${hBars(pe)}</div><div class="surf rounded-lg p-4"><h2 class="font-bold mb-2">How customers pay &amp; buy</h2><div class="text-xs mute mb-1">Payment mode</div>${hBars(rows(pm))}<div class="text-xs mute mb-1 mt-3">Order type</div>${hBars(rows(ty))}</div></div>
<div class="grid md:grid-cols-2 gap-4 mb-4"><div class="surf rounded-lg p-4"><h2 class="font-bold mb-2">Busiest hours <span class="text-xs mute font-normal">(sales by hour of day)</span></h2>${c.er.length?barChart(hrs,[{n:'Sales',c:'var(--clay)'}],{h:140}):'<p class="text-sm mute">No data yet.</p>'}</div><div class="surf rounded-lg p-4"><h2 class="font-bold mb-2">Best days of the week</h2>${c.er.length?barChart(wk,[{n:'Sales',c:'var(--gold)'}],{h:140}):'<p class="text-sm mute">No data yet.</p>'}</div></div>
<div class="surf rounded-lg p-4 mb-4"><div class="flex justify-between items-center mb-2"><h2 class="font-bold">Running low</h2><a href="/inventory" class="underline text-sm">Open inventory</a></div>${low.length?low.map(x=>`<div class="flex justify-between text-sm py-1 border-t"><span>${esc(x.name)}</span><b class="text-bad">${x.stock} left</b></div>`).join(''):'<p class="text-sm mute">No product is running low (5 or fewer). </p>'}</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3"><a href="/pos" class="btn b1">New bill</a><a href="/delivery" class="btn b2">Delivery settings</a><a href="/settings" class="btn b2">Shop &amp; staff</a><a href="/plans" class="btn b2">Plan &amp; commission</a></div>`;
icons();
A.querySelector('.chips').onclick=e=>{const b=e.target.closest('[data-range]');if(!b)return;range=b.dataset.range;try{localStorage.hk_dr=range}catch(x){}draw()}};
const draw=()=>draw0().catch(e=>{A.innerHTML=errBox(e,{home:false})});await draw0();
},skRows(4));</script></body></html>
