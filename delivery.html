<!doctype html><html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery · Hasta-Kala</title><link rel="icon" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/store.css"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head><body><main id="app" class="max-w-6xl mx-auto p-4 w-full"></main><script>
boot(async(U,A)=>{
if(!guard(U,['owner']))return;
const sh=must(await sb.from('shops').select('*').eq('id',U.shop).single());
const V={on:sh.delivery_enabled!==false,pin:sh.pincode||'',lf:+sh.delivery_local_fee,sf:sh.delivery_state_fee??sh.delivery_far_fee,ff:+sh.delivery_far_fee,fa:sh.free_above??'',ld:sh.local_days||'1-2',sd:sh.state_days||sh.far_days||'2-4',fd:sh.far_days||'4-7',hd:sh.handling_days??1,india:sh.ships_india!==false,cod:sh.cod_enabled!==false,pk:sh.pickup_enabled!==false,pa:sh.pickup_address||''};
const zone=(k,ic,t,desc,fee,days,extra='')=>`<div class="zone"><h3><i data-lucide="${ic}" class="w-5 h-5"></i>${t}</h3><p class="text-xs mute mb-2">${desc}</p><div class="grid grid-cols-2 gap-2"><div><label class="lbl" for="${k}_f">Fee ₹ <span class="font-normal">(0 = free)</span></label><input id="${k}_f" type="number" min="0" value="${esc(fee)}" class="${I}"></div><div><label class="lbl" for="${k}_d">Delivery time (days)</label><input id="${k}_d" maxlength="20" value="${esc(days)}" placeholder="e.g. 2-4" class="${I}"></div></div>${extra}</div>`;
A.innerHTML=`<div class="flex items-center justify-between gap-2 flex-wrap mb-1"><h1 class="text-xl font-bold">Delivery</h1><a href="/sales" class="btn b2"><i data-lucide="package" class="w-4 h-4"></i> Ship orders</a></div>
<p class="text-sm mute mb-4">Set how your orders reach customers. Customers see the fee and an estimated delivery date before they pay, just like on large shopping apps. Delivery fees go to you; Hasta·Kala takes no commission on them.</p>
<form id="df" novalidate>
<div class="grid md:grid-cols-3 gap-3 mb-4">
<div class="surf rounded-lg p-3"><label class="sw"><input type="checkbox" id="on" ${V.on?'checked':''}><span><b>Home delivery</b><span class="block text-xs mute">Ship orders to customers' addresses</span></span></label></div>
<div class="surf rounded-lg p-3"><label class="sw"><input type="checkbox" id="pk" ${V.pk?'checked':''}><span><b>Store pickup</b><span class="block text-xs mute">Customers collect, no delivery fee</span></span></label></div>
<div class="surf rounded-lg p-3"><label class="sw"><input type="checkbox" id="cod" ${V.cod?'checked':''}><span><b>Cash on delivery</b><span class="block text-xs mute">Customer pays when parcel arrives</span></span></label></div></div>
<div id="dz"><div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-1">1. Where do you ship from?</h2><p class="text-xs mute mb-2">Your shop's pincode decides which zone a customer falls in. Indian pincodes start with digits that show the area and the state, so we compare the customer's pincode with yours.</p>
<div class="grid md:grid-cols-3 gap-2 items-end"><div><label class="lbl" for="pin">Your shop pincode</label><input id="pin" inputmode="numeric" maxlength="6" value="${esc(V.pin)}" class="${I}"></div><div><label class="lbl" for="hd">Packing time (days)</label><select id="hd" class="${I}">${[0,1,2,3,4,5,7].map(n=>`<option value="${n}" ${n==V.hd?'selected':''}>${n==0?'Same day':n+' day'+(n>1?'s':'')}</option>`).join('')}</select></div><p class="text-xs mute">Packing time is added to the delivery time when we show the customer an estimated date.</p></div></div>
<div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-1">2. Fee and delivery time for each zone</h2><p class="text-xs mute mb-3">Quick start: <button type="button" class="underline" data-pre="std">Standard fees</button> · <button type="button" class="underline" data-pre="free">Free delivery everywhere</button> · <button type="button" class="underline" data-pre="flat">One flat fee</button></p>
<div class="grid md:grid-cols-3 gap-3">${zone('l','map-pin','Local',ZONES.local.d+'. Usually the same city.',V.lf,V.ld)}${zone('s','map','Within state',ZONES.state.d+'.',V.sf,V.sd)}${zone('f','globe','Rest of India',ZONES.india.d+'.',V.ff,V.fd,`<label class="sw mt-1"><input type="checkbox" id="in" ${V.india?'checked':''}><span class="text-sm">Deliver across India<span class="block text-xs mute">Off = only Local and Within state</span></span></label>`)}</div></div>
<div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-1">3. Free delivery offer</h2><p class="text-xs mute mb-2">Encourage bigger baskets. The cart shows “Add ₹X more for free delivery” to the customer. Leave empty to never offer free delivery.</p><div class="max-w-xs"><label class="lbl" for="fa">Free delivery on orders above ₹</label><input id="fa" type="number" min="1" placeholder="e.g. 999" value="${esc(V.fa)}" class="${I}"></div></div></div>
<div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-1">Pickup address</h2><p class="text-xs mute mb-2">Shown to customers who choose store pickup.</p><input id="pa" maxlength="300" value="${esc(V.pa)}" placeholder="Shop no., street, area" class="${I}"></div>
<div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-2"><i data-lucide="eye" class="w-4 h-4 inline"></i> What your customer will see</h2><div class="grid grid-cols-2 gap-2 max-w-md mb-3"><div><label class="lbl" for="tp">Customer pincode</label><input id="tp" inputmode="numeric" maxlength="6" placeholder="e.g. 570001" class="${I}"></div><div><label class="lbl" for="tv">Cart value ₹</label><input id="tv" type="number" min="1" value="500" class="${I}"></div></div><div id="pv" class="text-sm"></div></div>
<p id="er" class="text-bad text-sm mb-2" role="alert" hidden></p><button class="${B}">Save delivery settings</button></form>
<details class="surf rounded-lg p-4 mt-4"><summary class="font-bold cursor-pointer">How delivery works, step by step</summary><ol class="text-sm mt-2 space-y-1" style="list-style:decimal;padding-left:1.2rem"><li>The customer enters a pincode. We compare it with your pincode: same first 3 digits = <b>Local</b>, same state = <b>Within state</b>, anything else = <b>Rest of India</b>.</li><li>They see the fee and the estimated delivery date (packing time + delivery time) before paying.</li><li>You get the order in <b>Sales</b>. Mark it <b>Packed</b>, hand it to your courier, then enter the courier name and tracking number or link and mark it <b>Shipped</b>. The customer sees a <b>Track parcel</b> link.</li><li>Mark it <b>Delivered</b> when it arrives. For cash on delivery, the sale counts as earned only after Delivered.</li><li>If an order is not paid online within 60 minutes it is cancelled and the stock returns automatically.</li></ol></details>`;
icons();
const g=id=>$('#'+id);
const read=()=>({delivery_enabled:g('on').checked,pincode:g('pin').value.trim(),delivery_local_fee:+g('l_f').value||0,delivery_state_fee:+g('s_f').value||0,delivery_far_fee:+g('f_f').value||0,free_above:+g('fa').value||null,local_days:g('l_d').value.trim(),state_days:g('s_d').value.trim(),far_days:g('f_d').value.trim(),handling_days:+g('hd').value||0,ships_india:g('in').checked,cod_enabled:g('cod').checked,pickup_enabled:g('pk').checked,pickup_address:g('pa').value.trim()||null,city:sh.city});
const preview=()=>{const s=read(),pin=g('tp').value.trim(),v=+g('tv').value||0,out=g('pv');g('dz').style.opacity=s.delivery_enabled?1:.45;
 if(!/^[1-9]\d{5}$/.test(pin)){out.innerHTML='<p class="mute">Type a 6-digit pincode above to preview the delivery fee and date.</p>';return}
 if(!/^[1-9]\d{5}$/.test(s.pincode)){out.innerHTML='<p class="text-bad">Enter your own shop pincode first.</p>';return}
 const r=deliveryCalc(s,pin,v);if(!r.ok){out.innerHTML=`<p class="text-bad">${esc(r.msg)}</p>`;return}
 out.innerHTML=`<p class="mb-1"><span class="px-2 rounded t-info">${esc(ZONES[r.zone].n)}</span> <b>${r.fee?inr(r.fee):'FREE delivery'}</b></p>${r.eta?`<div class="eta"><i data-lucide="truck" class="w-5 h-5 shrink-0"></i><span>Delivery by <b>${esc(r.eta)}</b></span></div>`:''}${r.freeLeft>0?`<p class="mt-2">${I18N.t('Add {0} more for free delivery','<b>'+inr(Math.ceil(r.freeLeft))+'</b>')}</p><div class="prog mt-1" style="max-width:20rem"><i style="width:${Math.min(100,v/s.free_above*100)}%"></i></div>`:s.free_above&&r.fee==0?'<p class="mt-2 text-ok">Free delivery offer applied.</p>':''}`;icons()};
A.addEventListener('input',preview);A.addEventListener('change',preview);preview();
A.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{const m={std:[40,70,100,'1-2','2-4','4-7'],free:[0,0,0,'1-2','2-4','4-7'],flat:[60,60,60,'2-3','2-3','4-7']}[b.dataset.pre];['l_f','s_f','f_f','l_d','s_d','f_d'].forEach((id,i)=>g(id).value=m[i]);preview()});
g('df').onsubmit=async ev=>{ev.preventDefault();const er=g('er');er.hidden=true;const s=read();delete s.city;
 const bad=s.delivery_enabled&&!/^[1-9]\d{5}$/.test(s.pincode)?'Enter your 6-digit shop pincode. It decides which orders count as local.':!s.delivery_enabled&&!s.pickup_enabled?'Turn on Home delivery or Store pickup, otherwise customers cannot order.':s.delivery_enabled&&(!s.local_days||!s.state_days||!s.far_days)?'Enter the delivery time for every zone, for example 2-4.':s.pickup_enabled&&!s.pickup_address?'Add your pickup address so customers know where to collect.':'';
 if(bad){er.hidden=false;er.textContent=bad;return}
 if(!/^[1-9]\d{5}$/.test(s.pincode))s.pincode=sh.pincode||null;
 const{error}=await sb.from('shops').update(s).eq('id',U.shop);if(error){er.hidden=false;er.textContent=msgOf(error);return}notice('Delivery settings saved')};
},skRows(4));
</script></body></html>
