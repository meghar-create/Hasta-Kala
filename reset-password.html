<!DOCTYPE html>
<html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Set new password | Hasta-Kala</title><link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/store.css"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head>
<body class="auth">
<aside class="auth-brand"><div class="lockup"><img class="js-logo" src="/assets/icons/mark.svg" alt=""><div class="brand lk-name">Hasta&#x200A;·&#x200A;Kala</div><div class="lk-tag">Handcrafted Heritage</div></div></aside>
<div class="auth-main"><main class="auth-center"><div class="auth-card">
<div class="auth-head"><img src="/assets/icons/mark.svg" alt="Hasta-Kala"><div class="min-w-0"><div class="brand nm">Hasta&#x200A;·&#x200A;Kala</div><div class="sub">Handcrafted Heritage</div></div></div>
<div class="auth-box" id="app"><div class="auth-role"><span class="ico"><i data-lucide="lock-keyhole"></i></span><div><h1>Set a new password</h1><p id="msg">Checking your reset link…</p></div></div><form id="f" class="auth-form" novalidate hidden><label class="block"><span class="lbl">New password</span><span class="ctl"><i data-lucide="lock"></i><input class="in" type="password" name="p1" autocomplete="new-password" minlength="8" required></span></label><label class="block"><span class="lbl">Confirm password</span><span class="ctl"><i data-lucide="lock"></i><input class="in" type="password" name="p2" autocomplete="new-password" minlength="8" required></span></label><div class="auth-err" role="alert" hidden><i data-lucide="circle-alert"></i><span></span></div><button class="btn auth-btn gold">Update password</button></form><p id="bad" class="text-center text-sm mt-4" hidden><a href="/forgot-password" class="auth-link">Request a new link</a></p></div>
<p class="auth-alt"><a href="/login">Customer</a> · <a href="/staff-login">Staff</a> · <a href="/owner-login">Shop owner</a> · <a href="/">Back to store</a></p>
</div></main><footer class="auth-foot">© 2026 <b class="brand-foot">Hasta&#x200A;·&#x200A;Kala</b><span class="fsep" aria-hidden="true"></span>Handcrafted Heritage</footer></div>
<script>(()=>{const f=document.getElementById('f'),msg=document.getElementById('msg'),bad=document.getElementById('bad'),er=document.querySelector('.auth-err');
window.lucide&&lucide.createIcons();let shown=false;
const err=m=>{er.hidden=!m;er.lastElementChild.textContent=m||''};f.addEventListener('input',()=>err(''));
const show=()=>{if(shown)return;shown=true;msg.textContent='Choose a new password (at least 8 characters).';f.hidden=false};
const fail=m=>{if(shown)return;msg.textContent=m||'This reset link is invalid or has expired.';bad.hidden=false};
const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);
if(h.get('error')||q.get('error'))fail('This reset link is invalid or has expired.');
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')show()});
(async()=>{if(h.get('type')==='recovery'){const{data:{session}}=await sb.auth.getSession();if(session)return show()}const code=q.get('code');if(code){const{error}=await sb.auth.exchangeCodeForSession(code);if(!error)return show()}
setTimeout(()=>fail(),3500)})();
f.onsubmit=async e=>{e.preventDefault();const a=f.p1.value,b=f.p2.value;
if(a.length<8)return err('Use at least 8 characters.');if(a!==b)return err('The two passwords do not match.');
const btn=f.querySelector('button');btn.disabled=true;const{error}=await sb.auth.updateUser({password:a});btn.disabled=false;
if(error)return err(error.message);await sb.auth.signOut();f.hidden=true;
msg.innerHTML='Your password has been updated. <a href="/login" class="auth-link">Sign in with your new password</a>.'}})();</script></body></html>
