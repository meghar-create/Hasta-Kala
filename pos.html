<!doctype html><html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing · Hasta-Kala</title><link rel="icon" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css?v=25b"><link rel="stylesheet" href="/assets/css/store.css?v=25b"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head><body><main id="app" class="max-w-6xl mx-auto p-4 w-full"></main><script>
boot(async(U,A)=>{
if(!guard(U,['owner','staff']))return;
const get=async()=>must(await sb.from('products').select('*').eq('shop_id',U.shop).gt('stock',0).order('name').limit(1000));
let ps=await get(),bill=[],sq='',cust='',pay='Cash',busy=false,disc='',dk='flat',recv='',last=null,autoP=localStorage.hk_autoprint!='0';
if(!ps.length){A.innerHTML=emptyBox('boxes','No products in stock','Add products or restock items to start billing.',U.role=='owner'?'<a href="/inventory" class="btn b1">Go to Inventory</a>':'');return}
const r2=n=>Math.round(n*100)/100;
const calc=()=>{const sub=bill.reduce((a,i)=>a+i.price*i.qty,0),v=Math.max(+disc||0,0);let d=dk=='pct'?r2(sub*Math.min(v,100)/100):v;d=Math.min(r2(d),sub);return{sub,d,total:r2(sub-d)}};
const grid=()=>{const m=ps.filter(p=>p.name.toLowerCase().includes(sq.toLowerCase()));$('#g').innerHTML=m.map(p=>`<button data-p="${p.id}" class="surf rounded p-2 text-left"><img src="${esc(safeUrl(prodImgs(p)[0],'/assets/icons/mark.svg'))}" alt="" loading="lazy" class="aspect-square object-cover rounded mb-1 w-full"><div class="text-sm">${esc(p.name)}</div><b>${inr(p.price)}</b> <span class="text-xs mute">${p.stock} left</span></button>`).join('')||`<p class="mute col-span-full">${ps.length?'No product matches “'+esc(sq)+'”.':'Everything is sold out.'}</p>`;
A.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=ps.find(x=>x.id==b.dataset.p),x=bill.find(i=>i.id==p.id);if(x){if(x.qty<p.stock)x.qty++;else notice('Only '+p.stock+' of '+p.name+' in stock.','err')}else bill.push({...p,qty:1});draw()})};
/* totals block, repainted on every keystroke without redrawing the whole page */
const paintTot=()=>{const{sub,d,total}=calc(),r=+recv,ch=pay=='Cash'&&recv!==''&&bill.length?r2(r-total):null;
 $('#tot').innerHTML=`<div class="flex justify-between text-sm"><span>Subtotal</span><span>${inr(sub)}</span></div>${d?`<div class="flex justify-between text-sm text-ok"><span>Discount</span><span>−${inr(d)}</span></div>`:''}<p class="text-xl font-bold flex justify-between"><span>Total</span><span>${inr(total)}</span></p>${ch===null?'':`<p class="font-medium ${ch>=0?'text-ok':'text-bad'}">${ch>=0?'Change to return '+inr(ch):'Short by '+inr(-ch)}</p>`}`;
 const j=$('#jump');if(j){j.hidden=!bill.length;j.textContent='Bill ('+bill.reduce((a,i)=>a+i.qty,0)+') · '+inr(total)}};
const draw=()=>{
A.innerHTML=`${last?`<div class="note ok mb-3 flex-wrap" role="status" style="box-shadow:none"><i data-lucide="circle-check" class="w-5 h-5 shrink-0"></i><span>Bill #${last.id} saved · ${inr(last.total)}${last.change>0?' · return '+inr(last.change)+' change':''}. <a href="/invoice?id=${last.id}" class="underline">View / print invoice</a></span><button id="lx" class="underline ml-auto" aria-label="Dismiss">Dismiss</button></div>`:''}
<div class="grid md:grid-cols-3 gap-4"><div class="md:col-span-2 min-w-0"><label class="sr-only" for="s">Search product</label><input id="s" value="${esc(sq)}" placeholder="Search product" class="${I} mb-3"><div id="g" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div></div>
<div id="bill" class="surf rounded-lg p-4 space-y-2 h-fit"><h2 class="font-bold">Current bill <span class="text-xs mute font-normal">In-store sale</span></h2>${bill.map(i=>`<div class="flex items-center gap-1"><span class="flex-1 min-w-0" style="overflow-wrap:anywhere">${esc(i.name)}<span class="block text-xs mute">${inr(i.price)} each</span></span><input type="number" aria-label="Quantity for ${esc(i.name)}" min="1" max="${i.stock}" value="${i.qty}" data-q="${i.id}" class="border w-14 px-1"><span class="w-20 text-right">${inr(i.price*i.qty)}</span><button data-x="${i.id}" aria-label="Remove ${esc(i.name)}" class="text-bad px-1">×</button></div>`).join('')||'<p class="text-sm mute">Tap products to add</p>'}
<div class="flex gap-2"><label class="sr-only" for="dv">Discount</label><input id="dv" type="number" min="0" inputmode="decimal" value="${esc(disc)}" placeholder="Discount (optional)" class="${I}"><label class="sr-only" for="dk">Discount type</label><select id="dk" class="${I}" style="max-width:4.5rem"><option value="flat" ${dk=='flat'?'selected':''}>₹</option><option value="pct" ${dk=='pct'?'selected':''}>%</option></select></div>
<input id="cn" aria-label="Customer name" value="${esc(cust)}" placeholder="Customer name (optional)" class="${I}"><select id="pm" aria-label="Payment mode" class="${I}">${['Cash','UPI','Card'].map(m=>`<option ${m==pay?'selected':''}>${m}</option>`).join('')}</select>
${pay=='Cash'?`<input id="rv" type="number" min="0" inputmode="decimal" value="${esc(recv)}" aria-label="Cash received" placeholder="Cash received (optional)" class="${I}">`:''}
<div id="tot"></div><label class="flex items-center gap-2 text-sm"><input type="checkbox" id="ap" ${autoP?'checked':''}> Open the print window after the sale</label><button id="done" class="${B} w-full">Complete sale &amp; show bill</button><p class="text-xs mute">Billed by <b>${esc(U.pf?.full_name||U.pf?.email||'you')}</b> (${U.role=='owner'?'Owner':'Staff'})</p></div></div>
<button id="jump" type="button" class="btn b1 md:hidden" style="position:fixed;right:12px;bottom:12px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.35)"></button>`;icons();
grid();paintTot();$('#s').oninput=e=>{sq=e.target.value;grid()};$('#cn').oninput=e=>cust=e.target.value;
$('#dv').oninput=e=>{disc=e.target.value;paintTot()};$('#dk').onchange=e=>{dk=e.target.value;paintTot()};$('#rv')&&($('#rv').oninput=e=>{recv=e.target.value;paintTot()});
$('#pm').onchange=e=>{pay=e.target.value;draw()};$('#ap').onchange=e=>{autoP=e.target.checked;localStorage.hk_autoprint=autoP?'1':'0'};$('#lx')&&($('#lx').onclick=()=>{last=null;draw()});
$('#jump').onclick=()=>$('#bill').scrollIntoView({behavior:'smooth',block:'start'});
A.querySelectorAll('[data-q]').forEach(e=>e.onchange=()=>{bill.find(i=>i.id==e.dataset.q).qty=Math.max(1,Math.min(+e.max,Math.floor(+e.value)||1));draw()});
A.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{bill=bill.filter(i=>i.id!=e.dataset.x);draw()});
$('#done').onclick=async()=>{if(busy)return;if(!bill.length)return notice('The bill is empty. Tap a product to add it.','err');const c=calc();
 if(pay=='Cash'&&recv!==''&&+recv<c.total)return notice('Cash received is less than the total.','err');
 busy=true;$('#done').disabled=true;
 const{data,error}=await sb.rpc('pos_sale',{items:bill.map(i=>({id:i.id,qty:i.qty})),cust:cust.trim(),pay,disc:c.d});busy=false;
 if(error){$('#done').disabled=false;return notice(error,'err')}
 /* the bill opens straight away (and the print window, if switched on) */
 location='/invoice?id='+data+'&new=1'+(autoP?'&print=1':'');return}};
draw()},skRows(2));
</script></body></html>
