<!doctype html><html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan & billing · Hasta-Kala</title><link rel="icon" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/store.css"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head><body><main id="app" class="max-w-6xl mx-auto p-4 w-full"></main><script>
boot(async(U,A)=>{
if(!guard(U,['owner']))return;
let slider=50000;
const draw0=async()=>{
const[sh,pls,pays,sets]=await Promise.all([sb.from('shops').select('*,plans(*)').eq('id',U.shop).single().then(must),sb.from('plans').select('*').order('price'),sb.from('sub_payments').select('*,plans(name)').eq('shop_id',U.shop).order('paid_at',{ascending:false}).limit(24),sb.from('settlements').select('*').eq('shop_id',U.shop).order('created_at',{ascending:false})]).then(a=>a.map((r,i)=>i<1?r:chk(r).data));
const plans=pls.data||pls,cur=sh.plans,exp=new Date(sh.sub_expires_at),paidPlan=+cur.price>0,daysLeft=Math.ceil((exp-new Date())/864e5),live=sh.approved&&sh.sub_status!='suspended'&&(!paidPlan||exp>new Date());
const orders=await fetchAll((a,b)=>sb.from('orders').select('id,total,delivery_fee,status,payment_status,payment_method,channel,commission_amt,commission_pct,created_at').eq('shop_id',U.shop).eq('channel','online').order('id').range(a,b));
const eo=orders.filter(earnedOrder),comm=eo.reduce((a,o)=>a+ +(o.commission_amt||0),0),held=eo.filter(o=>o.payment_method=='Online').reduce((a,o)=>a+ +o.total,0),commOn=eo.filter(o=>o.payment_method=='Online').reduce((a,o)=>a+ +(o.commission_amt||0),0),commCod=comm-commOn,settled=sets.reduce((a,x)=>a+ +x.amount,0),bal=held-commOn-commCod-settled;
const cost=(p,v)=>+p.price+v*p.commission_pct/100,best=plans.reduce((a,p)=>cost(p,slider)<cost(a,slider)?p:a,plans[0]);
const feat=p=>[[`List up to ${p.max_products>=100000?'unlimited':p.max_products} products`,1],['Counter billing (POS) with printable bills',1],['Staff accounts, sales filters and analytics',1],['Coupons, delivery settings and store pickup',1],[`${p.commission_pct}% commission on online orders only`,1],['No commission on counter sales or delivery fees',1]];
A.innerHTML=`<h1 class="text-xl font-bold mb-3">Plan &amp; billing</h1>
<div class="rounded-lg p-4 mb-4 ${live?'t-ok':'t-bad'}"><b>${esc(sh.name)}</b> is on the <b>${esc(cur.name)}</b> plan · ${live?'LIVE':!sh.approved?'Awaiting approval by Hasta-Kala':sh.sub_status=='suspended'?'Suspended by Hasta-Kala. Contact support.':'NOT LIVE: your paid plan has expired'}${paidPlan?` · ${daysLeft>0?'renews/expires on '+esc(day(exp))+' ('+daysLeft+' day'+(daysLeft>1?'s':'')+' left)':'expired on '+esc(day(exp))}`:' · Free plan never expires'}${sh.sub_status=='trial'&&paidPlan?' · trial':''}</div>
<div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-2">How plans work</h2><ul class="text-sm space-y-1" style="list-style:disc;padding-left:1.2rem"><li><b>One simple fee per month.</b> Paid plans last 30 days from payment. Paying again before expiry adds 30 more days on top of what is left.</li><li><b>Commission is only on online orders</b> (orders placed by customers on the website). It is worked out on the items total after any coupon, <u>not</u> on the delivery fee. Counter bills you make in the shop never pay commission.</li><li><b>The rate is locked when the order is placed.</b> If you change plan later, old orders keep the rate they had.</li><li><b>If a paid plan expires, your store is hidden from customers</b> until you renew. Your data stays safe. The Free plan never expires, so it is always visible, but has the highest commission and a product limit.</li><li><b>Changing plans:</b> paying for a different plan switches you to it immediately. You can move back to Free yourself, but the paid days left are not refunded.</li></ul></div>
<div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-1">Which plan is cheapest for me?</h2><p class="text-xs mute mb-2">Move the slider to your expected online sales in a month. Total cost = monthly fee + commission.</p><label class="lbl" for="sl">Online sales per month: <b id="slv">${inr(slider)}</b></label><input id="sl" type="range" min="0" max="500000" step="5000" value="${slider}" style="width:100%;accent-color:var(--clay)">
<div id="cmp" class="grid md:grid-cols-3 gap-2 mt-2">${plans.map(p=>`<div class="rounded-lg p-3 ${p.id==best.id?'t-ok':'surf2'}"><div class="font-bold">${esc(p.name)} ${p.id==best.id?'· cheapest':''}</div><div class="text-xl font-bold">${inr(Math.round(cost(p,slider)))}<span class="text-xs font-normal"> / month</span></div><div class="text-xs">${inr(p.price)} fee + ${inr(Math.round(slider*p.commission_pct/100))} commission</div></div>`).join('')}</div></div>
<div class="grid md:grid-cols-3 gap-3 mb-4">${plans.map((p,i)=>{const isCur=p.id==sh.plan_id,up=+p.price>0;return `<div class="plan ${isCur?'cur':''}"><div class="flex justify-between items-center"><span class="pn">${esc(p.name)}</span>${isCur?'<span class="px-2 rounded t-ok text-xs">Your plan</span>':''}</div><div><span class="pp">${+p.price?inr(p.price):'₹0'}</span><span class="text-sm mute">${+p.price?' / month':' forever'}</span></div>
<ul>${feat(p).map(f=>`<li><i data-lucide="check" class="w-4 h-4 text-ok"></i><span>${esc(f[0])}</span></li>`).join('')}</ul>
<div class="mt-auto pt-2">${up?`<button data-buy="${p.id}" class="${B} w-full">${isCur?'Renew +30 days':'Switch to '+esc(p.name)} · ${inr(p.price)}</button>`:isCur?'<p class="text-sm mute text-center">You are on this plan</p>':`<button data-free="1" class="btn b2 w-full">Move to ${esc(p.name)}</button>`}</div></div>`}).join('')}</div>
<p class="text-xs mute mb-4">Payments are taken securely by Razorpay (UPI, cards, netbanking). Taxes, if applicable to your business, are not included in the prices shown.</p>
<div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-1">Your commission statement</h2><p class="text-xs mute mb-3">Money from online payments reaches Hasta-Kala first and is then paid out to you after commission. Cash-on-delivery money stays with you, so the commission on those orders is owed to Hasta-Kala.</p>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">${kpi('Online orders earned',eo.length,'paid + delivered')}${kpi('Commission charged',inr(comm),'all time')}${kpi('Collected by Hasta-Kala for you',inr(held),'paid online incl. delivery fees')}${kpi(bal>=0?'Hasta-Kala owes you':'You owe Hasta-Kala',inr(Math.abs(Math.round(bal*100)/100)),'after commission and settlements')}</div>
<div class="overflow-x-auto"><table class="tbl"><tr><td>Paid online (money held by Hasta-Kala)</td><td class="r">${inr(held)}</td></tr><tr><td>− Commission on those orders</td><td class="r">−${inr(commOn)}</td></tr><tr><td>− Commission on cash-on-delivery / pay-at-store orders (cash is with you)</td><td class="r">−${inr(commCod)}</td></tr><tr><td>− Already settled ${settled>=0?'(paid to you)':'(paid by you)'}</td><td class="r">−${inr(settled)}</td></tr><tr><td><b>${bal>=0?'Balance Hasta-Kala will pay you':'Balance you will pay Hasta-Kala'}</b></td><td class="r"><b>${inr(Math.abs(Math.round(bal*100)/100))}</b></td></tr></table></div>
<p class="text-xs mute mt-2">Settlements are recorded by Hasta-Kala when money is paid or received. Payment-gateway charges, if any, are not included here.</p>
${sets.length?`<h3 class="font-bold mt-3 mb-1 text-sm">Settlement history</h3><div class="overflow-x-auto"><table class="tbl"><tr><th>Date</th><th>Direction</th><th>Method / note</th><th class="r">Amount</th></tr>${sets.map(x=>`<tr><td>${esc(day(x.created_at))}</td><td>${x.amount>0?'Hasta-Kala paid you':'You paid Hasta-Kala'}</td><td>${esc([x.method,x.note].filter(Boolean).join(' · '))}</td><td class="r">${inr(Math.abs(x.amount))}</td></tr>`).join('')}</table></div>`:''}</div>
<div class="surf rounded-lg p-4"><h2 class="font-bold mb-2">Subscription payments</h2>${pays.length?`<div class="overflow-x-auto"><table class="tbl"><tr><th>Date</th><th>Plan</th><th class="r">Amount</th></tr>${pays.map(x=>`<tr><td>${esc(day(x.paid_at))}</td><td>${esc(x.plans?.name||'')}</td><td class="r">${inr(x.amount)}</td></tr>`).join('')}</table></div>`:'<p class="text-sm mute">No subscription payments yet.</p>'}</div>`;
icons();
const sl=$('#sl');sl.oninput=()=>{slider=+sl.value;$('#slv').textContent=inr(slider);const b=plans.reduce((a,p)=>cost(p,slider)<cost(a,slider)?p:a,plans[0]);$('#cmp').innerHTML=plans.map(p=>`<div class="rounded-lg p-3 ${p.id==b.id?'t-ok':'surf2'}"><div class="font-bold">${esc(p.name)} ${p.id==b.id?'· cheapest':''}</div><div class="text-xl font-bold">${inr(Math.round(cost(p,slider)))}<span class="text-xs font-normal"> / month</span></div><div class="text-xs">${inr(p.price)} fee + ${inr(Math.round(slider*p.commission_pct/100))} commission</div></div>`).join('')};
A.querySelectorAll('[data-buy]').forEach(e=>e.onclick=async()=>{try{if(await pay('create-sub-order',{plan_id:+e.dataset.buy},'verify-sub',{},'Hasta-Kala subscription',U.session.user.email)){notice('Payment successful. Your plan is updated.');draw()}}catch(x){notice(x,'err')}});
A.querySelectorAll('[data-free]').forEach(e=>e.onclick=async()=>{if(!confirm('Move to the Free plan now? Your remaining paid days are not refunded, commission goes up, and you can list fewer products.'))return;const{error}=await sb.rpc('downgrade_to_free');error?notice(error,'err'):(notice('You are now on the Free plan.'),draw())})};
const draw=()=>draw0().catch(e=>{A.innerHTML=errBox(e,{home:false})});await draw0();
},skRows(4));
</script></body></html>
