<!DOCTYPE html>
<html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Forgot password | Hasta-Kala</title><link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/store.css"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head>
<body class="auth">
<aside class="auth-brand"><div class="lockup"><img class="js-logo" src="/assets/icons/mark.svg" alt=""><div class="brand lk-name">Hasta&#x200A;·&#x200A;Kala</div><div class="lk-tag">Handcrafted Heritage</div></div></aside>
<div class="auth-main"><main class="auth-center"><div class="auth-card">
<div class="auth-head"><img src="/assets/icons/mark.svg" alt="Hasta-Kala"><div class="min-w-0"><div class="brand nm">Hasta&#x200A;·&#x200A;Kala</div><div class="sub">Handcrafted Heritage</div></div></div>
<div class="auth-box" id="app"><div class="auth-role"><span class="ico"><i data-lucide="key-round"></i></span><div><h1 id="h">Forgot your password?</h1><p id="sub">Enter your account email. We will email you a link to set a new password.</p></div></div>
<form id="f" class="auth-form" novalidate><label class="block"><span class="lbl">Email</span><span class="ctl"><i data-lucide="mail"></i><input class="in" type="email" name="em" autocomplete="email" required></span></label><div class="auth-err" role="alert" hidden><i data-lucide="circle-alert"></i><span></span></div><button class="btn auth-btn gold">Send reset email</button></form>
<form id="g" class="auth-form" novalidate hidden><label class="block"><span class="lbl">Code from your email</span><span class="ctl"><i data-lucide="shield-check"></i><input class="in" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required></span></label><label class="block"><span class="lbl">New password</span><span class="ctl"><i data-lucide="lock"></i><input class="in" type="password" name="p1" autocomplete="new-password" minlength="8" required></span></label><label class="block"><span class="lbl">Confirm new password</span><span class="ctl"><i data-lucide="lock"></i><input class="in" type="password" name="p2" autocomplete="new-password" minlength="8" required></span></label><div class="auth-err" role="alert" hidden><i data-lucide="circle-alert"></i><span></span></div><button class="btn auth-btn gold">Set new password</button><p class="text-center text-sm mt-3"><button type="button" id="rs" class="auth-link">Resend code</button> · <a href="#" id="bk" class="auth-link">Use a different email</a></p></form>
<p id="ok" class="auth-hint" hidden></p></div>
<p class="auth-alt"><a href="/login">Customer</a> · <a href="/staff-login">Staff</a> · <a href="/owner-login">Shop owner</a> · <a href="/">Back to store</a></p>
</div></main><footer class="auth-foot">© 2026 <b class="brand-foot">Hasta&#x200A;·&#x200A;Kala</b><span class="fsep" aria-hidden="true"></span>Handcrafted Heritage</footer></div>
<script>(()=>{const $=id=>document.getElementById(id),f=$('f'),g=$('g'),ok=$('ok');
const LOGIN={customer:['/login','Sign in'],staff:['/staff-login','Sign in as staff'],owner:['/owner-login','Sign in as shop owner']},R=LOGIN[new URLSearchParams(location.search).get('r')]||LOGIN.customer;
window.lucide&&lucide.createIcons();let email='';
const err=(form,m)=>{const e=form.querySelector('.auth-err');e.hidden=!m;e.lastElementChild.textContent=m||''};
f.addEventListener('input',()=>err(f,''));g.addEventListener('input',()=>err(g,''));
const cool=()=>{let n=60;const b=$('rs');b.disabled=true;b.textContent='Resend code in '+n+'s';const t=setInterval(()=>{n--;if(n<=0){clearInterval(t);b.disabled=false;b.textContent='Resend code'}else b.textContent='Resend code in '+n+'s'},1000)};
const send=async()=>{const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password'});
 if(error&&/rate|seconds|too many/i.test(error.message))return'Please wait a minute before asking for another code.';
 if(error&&!/not found|invalid/i.test(error.message))return'Could not send the email right now. Please try again shortly.';return''};
f.onsubmit=async e=>{e.preventDefault();const em=f.em.value.trim();if(!/^\S+@\S+\.\S+$/.test(em))return err(f,'Enter a valid email address.');
 const b=f.querySelector('button');b.disabled=true;email=em;const m=await send();b.disabled=false;if(m)return err(f,m);
 f.hidden=true;g.hidden=false;$('h').textContent='Check your email';$('sub').textContent='If an account exists for '+em+', we have sent an email. Click the link in it to set your new password. If it shows a 6-digit code instead, enter it below with your new password. Check the spam folder too.';cool();g.otp.focus()};
$('rs').onclick=async()=>{const m=await send();if(m)return err(g,m);err(g,'');cool()};
$('bk').onclick=e=>{e.preventDefault();g.hidden=true;f.hidden=false;$('h').textContent='Forgot your password?';$('sub').textContent='Enter your account email. We will email you a link to set a new password.'};
g.onsubmit=async e=>{e.preventDefault();const t=g.otp.value.replace(/\s/g,''),a=g.p1.value,b2=g.p2.value;
 if(!/^\d{6,10}$/.test(t))return err(g,'Enter the code from your email.');if(a.length<8)return err(g,'Use at least 8 characters for the new password.');if(a!==b2)return err(g,'The two passwords do not match.');
 const btn=g.querySelector('button.auth-btn');btn.disabled=true;
 const v=await sb.auth.verifyOtp({email,token:t,type:'recovery'});
 if(v.error){btn.disabled=false;return err(g,/expired|invalid/i.test(v.error.message)?'That code is wrong or has expired. Check it, or tap Resend code.':v.error.message)}
 const u=await sb.auth.updateUser({password:a});btn.disabled=false;
 if(u.error){return err(g,/same|different/i.test(u.error.message)?'Choose a password you have not used before.':u.error.message)}
 await sb.auth.signOut();g.hidden=true;$('h').textContent='Password updated';$('sub').textContent='You can now sign in with your new password.';ok.hidden=false;ok.innerHTML='<a href="'+R[0]+'" class="btn auth-btn gold" style="display:flex;justify-content:center">'+R[1]+'</a>'}})();</script></body></html>
