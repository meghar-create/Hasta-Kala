  b.close();up('shops',s.id,{sub_expires_at:nx.toISOString(),sub_status:s.sub_status=='suspended'?'suspended':'active'},'Extended by '+n+' days')}};
/* ---------- MONEY ---------- */
const moneyTab=()=>{const{sh,S,py,st,P}=D,tot=k=>sh.reduce((a,s)=>a+S[s.id][k],0),owe=sh.filter(s=>S[s.id].bal>0.5),recv=sh.filter(s=>S[s.id].bal<-0.5),sum=a=>a.reduce((x,s)=>x+Math.abs(S[s.id].bal),0);
 const byPlan=D.pl.map(p=>({l:p.name,v:py.filter(x=>x.plan_id==p.id).reduce((a,x)=>a+ +x.amount,0),s:py.filter(x=>x.plan_id==p.id).length+' payments'}));
 return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">${kpi('Commission earned (all time)',money(tot('comm')),'accrued on online orders')}${kpi('Subscriptions collected',money(py.reduce((a,x)=>a+ +x.amount,0)),py.length+' payments')}${kpi('You owe shops',money(sum(owe)),owe.length+' shop'+(owe.length==1?'':'s'))}${kpi('Shops owe you',money(sum(recv)),recv.length+' shop'+(recv.length==1?'':'s'))}</div>
 <div class="surf rounded-lg p-4 mb-4 overflow-x-auto"><div class="flex justify-between items-center gap-2 flex-wrap mb-1"><h2 class="font-bold">Shop settlements</h2><button id="mx" class="btn b2"><i data-lucide="download" class="w-4 h-4"></i> Export CSV</button></div><p class="text-xs mute mb-2">Online payments land in the Hasta-Kala Razorpay account. After commission, the rest is owed to the shop. For cash-on-delivery orders the shop keeps the cash and owes the commission. Open <b>Settle</b> after you transfer money.</p>
 <table class="tbl"><tr><th>Shop</th><th class="r">Paid online</th><th class="r">Commission</th><th class="r">Settled</th><th class="r">Balance</th><th></th></tr>${sh.map(s=>{const x=S[s.id];return `<tr><td>${esc(s.name)}</td><td class="r">${money(x.held)}</td><td class="r">${money(x.comm)}</td><td class="r">${money(x.settled)}</td><td class="r">${Math.abs(x.bal)<0.5?'<span class="mute">settled</span>':x.bal>0?`<b>Pay shop ${money(x.bal)}</b>`:`<b class="text-bad">Shop owes ${money(-x.bal)}</b>`}</td><td><button data-det="${s.id}" class="underline">Settle</button></td></tr>`}).join('')}</table><p class="text-xs mute mt-2">Razorpay gateway charges are not deducted in these figures.</p></div>
 <div class="grid md:grid-cols-2 gap-4"><div class="surf rounded-lg p-4 overflow-x-auto"><h2 class="font-bold mb-2">Subscription payments</h2><p class="text-xs mute mb-2">${hBars(byPlan,money).replace(/<div class="mb-2">/g,'<div class="mb-1">')}</p><table class="tbl"><tr><th>Date</th><th>Shop</th><th>Plan</th><th class="r">₹</th></tr>${py.slice(0,40).map(x=>`<tr><td>${esc(day(x.paid_at))}</td><td>${esc(x.shops?.name||'')}</td><td>${esc(x.plans?.name||'')}${x.razorpay_payment_id?'':' <span class="text-xs mute">(manual)</span>'}</td><td class="r">${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="mute">None yet.</td></tr>'}</table></div>
 <div class="surf rounded-lg p-4 overflow-x-auto"><h2 class="font-bold mb-2">Recent settlements</h2><table class="tbl"><tr><th>Date</th><th>Shop</th><th>Direction</th><th class="r">₹</th></tr>${st.slice(0,40).map(x=>`<tr><td>${esc(day(x.created_at))}</td><td>${esc(x.shops?.name||'')}</td><td>${x.amount>0?'Paid to shop':'From shop'}</td><td class="r">${money(Math.abs(x.amount))}</td></tr>`).join('')||'<tr><td colspan="4" class="mute">None yet.</td></tr>'}</table></div></div>`};
/* ---------- PLANS ---------- */
const plansTab=()=>{const{pl,sh,live}=D;return `<div class="surf rounded-lg p-4 mb-4 overflow-x-auto"><h2 class="font-bold mb-1">Plans</h2><p class="text-xs mute mb-2">Changes apply immediately to the price shown, the product limit and <b>new orders</b>. Orders already placed keep the commission rate they were placed with.</p>
 <table class="tbl"><tr><th>Name</th><th>Price ₹/mo</th><th>Max products</th><th>Commission %</th><th class="r">Live shops</th></tr>${pl.map(p=>`<tr><td><input data-p="${p.id}" data-f="name" value="${esc(p.name)}" maxlength="30" class="border w-28 px-1"></td><td><input data-p="${p.id}" data-f="price" type="number" min="0" value="${p.price}" class="border w-24 px-1"></td><td><input data-p="${p.id}" data-f="max_products" type="number" min="1" value="${p.max_products}" class="border w-28 px-1"></td><td><input data-p="${p.id}" data-f="commission_pct" type="number" min="0" max="100" step="0.5" value="${p.commission_pct}" class="border w-20 px-1"></td><td class="r">${sh.filter(s=>s.plan_id==p.id&&live(s)).length} / ${sh.filter(s=>s.plan_id==p.id).length}</td></tr>`).join('')}</table></div>
 <div class="surf rounded-lg p-4"><h2 class="font-bold mb-2">Add a plan</h2><div class="grid grid-cols-2 md:grid-cols-5 gap-2"><input id="np_n" placeholder="Name" maxlength="30" class="${I}"><input id="np_p" type="number" min="0" placeholder="Price ₹/mo" class="${I}"><input id="np_m" type="number" min="1" placeholder="Max products" class="${I}"><input id="np_c" type="number" min="0" max="100" step="0.5" placeholder="Commission %" class="${I}"><button id="np_a" class="${B}">Add plan</button></div></div>`};
/* ---------- USERS ---------- */
const usersTab=()=>{const{us,sh}=D,cnt=r=>us.filter(u=>u.role==r).length,sn=id=>sh.find(s=>s.id==id)?.name||'—';
 return `<div class="grid grid-cols-3 gap-3 mb-4">${kpi('Customers',cnt('customer'))}${kpi('Owners',cnt('owner'))}${kpi('Staff',cnt('staff'))}</div>
 <div class="surf rounded-lg p-4 mb-4 overflow-x-auto"><h2 class="font-bold mb-2">Owners and staff</h2><table class="tbl"><tr><th>Name</th><th>Email</th><th>Role</th><th>Shop</th><th>Joined</th></tr>${us.filter(u=>u.role=='owner'||u.role=='staff').map(u=>`<tr><td>${esc(u.full_name||'—')}</td><td>${esc(u.email)}</td><td>${u.role=='owner'?'Owner':'Staff'}</td><td>${esc(sn(u.shop_id))}</td><td>${esc(day(u.created_at))}</td></tr>`).join('')||'<tr><td colspan="5" class="mute">None.</td></tr>'}</table></div>
 <div class="surf rounded-lg p-4 overflow-x-auto"><h2 class="font-bold">Customers (${cnt('customer')})</h2><input id="cs" class="${I} mt-2" placeholder="Search customers by email or name" aria-label="Search customers" value="${esc(cq)}"><table class="tbl mt-2"><tr><th>Email</th><th>Name</th><th>Joined</th></tr><tbody id="cb"></tbody></table><div id="cm" class="text-center mt-3"></div></div>`};
const inbox=()=>`<div class="surf rounded-lg p-4"><h2 class="font-bold mb-2">Contact messages ${D.cm.length?'('+D.cm.length+' latest)':''}</h2>${D.cm.map(m=>`<div class="border-t py-2"><div class="flex justify-between gap-2 flex-wrap"><b>${esc(m.subject||'(no subject)')}</b><span class="text-xs mute">${esc(when(m.created_at))}</span></div><div class="text-sm mute">${esc(m.name)} · <a class="underline" href="mailto:${esc(m.email)}">${esc(m.email)}</a></div><p class="text-sm mt-1" style="white-space:pre-wrap">${esc(m.message)}</p><button data-cm="${m.id}" class="text-bad text-xs underline">Delete</button></div>`).join('')||'<p class="text-sm mute">No messages yet.</p>'}</div>`;
/* ---------- paint + events ---------- */
const paint=()=>{const sc=scrollY;A.innerHTML=`<div class="flex items-center justify-between gap-2 flex-wrap mb-2"><h1 class="text-xl font-bold">Super Admin</h1><button id="rf" class="btn b2"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh</button></div><nav class="subnav" aria-label="Super admin sections">${TABS.map(t=>`<a href="#${t[0]}" data-go="${t[0]}" class="${t[0]==tab?'on':''}"><i data-lucide="${t[2]}" class="w-4 h-4"></i>${t[1]}${t[0]=='shops'&&D.sh.some(s=>!s.approved)?` <span class="tab-cnt">${D.sh.filter(s=>!s.approved).length}</span>`:''}${t[0]=='inbox'&&D.cm.length?` <span class="tab-cnt">${D.cm.length}</span>`:''}</a>`).join('')}</nav><div id="tb">${{overview,shops,money:moneyTab,plans:plansTab,users:usersTab,inbox}[tab]()}</div>`;icons();bind();scrollTo(0,sc)};
const bind=()=>{const T=$('#tb');$('#rf').onclick=reload;
 A.querySelectorAll('.subnav [data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();tab=a.dataset.go;history.replaceState(null,'','#'+tab);paint()});
 T.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();tab=a.dataset.go;if(a.dataset.f!=null){SF={q:'',st:a.dataset.f,pl:'',city:''}}history.replaceState(null,'','#'+tab);paint()});
 const ch=T.querySelector('.chips');ch&&(ch.onclick=e=>{const b=e.target.closest('[data-range]');if(!b)return;range=b.dataset.range;try{localStorage.hk_sr=range}catch(x){}paint()});
 T.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>detail(+b.dataset.det));T.querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>extend(+b.dataset.ext));
 if(tab=='shops'){let t;$('#sq').oninput=e=>{SF.q=e.target.value;clearTimeout(t);t=setTimeout(()=>{paint();const i=$('#sq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)};
  [['sst','st'],['spl','pl'],['sct','city']].forEach(([i,k])=>$('#'+i).onchange=e=>{SF[k]=e.target.value;paint()});
  $('#sx').onclick=()=>csvDownload('shops-'+ymd(new Date())+'.csv',[['Shop','City','Owner','Plan','Status','Valid till','Orders','Sales','Online sales','Commission','Balance (+ you owe shop)'],...shopsRows().map(s=>{const x=D.S[s.id];return[s.name,s.city,D.em[s.owner_id]?.email||'',D.P[s.plan_id].name,D.status(s),ymd(s.sub_expires_at),x.n,x.gmv,x.on,x.comm,x.bal]})]);
  T.querySelectorAll('[data-pl]').forEach(e=>e.onchange=()=>up('shops',e.dataset.pl,{plan_id:+e.value},'Plan changed'));
  T.querySelectorAll('[data-ap]').forEach(e=>e.onclick=()=>{const s=D.sh.find(x=>x.id==e.dataset.ap);if(s.approved&&!confirm('Unapprove '+s.name+'? Customers will no longer see this store.'))return;up('shops',s.id,{approved:!s.approved},s.approved?'Shop unapproved':'Shop approved')});
  T.querySelectorAll('[data-su]').forEach(e=>e.onclick=()=>{const s=D.sh.find(x=>x.id==e.dataset.su),sus=s.sub_status!='suspended';if(sus&&!confirm('Suspend '+s.name+'? The store goes offline immediately.'))return;up('shops',s.id,{sub_status:sus?'suspended':'active'},sus?'Shop suspended':'Shop reactivated')});
  $('#oa').onclick=async()=>{const b=$('#oa');b.disabled=true;try{await api('create-owner',{name:$('#on').value,email:$('#oe').value,password:$('#op').value,shop_name:$('#os').value,city:$('#oc').value});notice('Owner account and shop created. Share the email and password with the owner.');reload()}catch(e){notice(e,'err');b.disabled=false}}}
 if(tab=='money'){$('#mx').onclick=()=>csvDownload('settlements-'+ymd(new Date())+'.csv',[['Shop','Paid online','Commission (all)','Commission on online-paid','Commission on cash orders','Settled so far','Balance (+ you owe shop, - shop owes you)'],...D.sh.map(s=>{const x=D.S[s.id];return[s.name,x.held,x.comm,x.commOn,x.commCod,x.settled,x.bal]})])}
 if(tab=='plans'){T.querySelectorAll('[data-p]').forEach(e=>e.onchange=()=>{const f=e.dataset.f,v=f=='name'?e.value.trim():+e.value;if(f=='name'&&!v||f!='name'&&(isNaN(v)||v<0)||f=='commission_pct'&&v>100||f=='max_products'&&v<1){notice('That value is not allowed.','err');return reload()}up('plans',e.dataset.p,{[f]:v},'Plan updated')});
  $('#np_a').onclick=async()=>{const n=$('#np_n').value.trim(),pr=+$('#np_p').value,mp=Math.floor(+$('#np_m').value),c=+$('#np_c').value;if(!n||!(pr>=0)||!(mp>=1)||!(c>=0&&c<=100))return notice('Fill in name, price, max products and a commission between 0 and 100.','err');const{error}=await sb.from('plans').insert({name:n,price:pr,max_products:mp,commission_pct:c});error?notice(error,'err'):(notice('Plan added'),reload())}}
 if(tab=='users'){const paintU=()=>{const f=D.us.filter(u=>u.role=='customer'&&(u.email+' '+(u.full_name||'')).toLowerCase().includes(cq));$('#cb').innerHTML=f.slice(0,userN).map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.full_name)}</td><td>${esc(when(u.created_at))}</td></tr>`).join('')||'<tr><td colspan="3" class="mute">No customers found.</td></tr>';$('#cm').innerHTML=f.length>userN?`<button id="um" class="btn b2">Show more (${userN} of ${f.length})</button>`:'';$('#um')&&($('#um').onclick=()=>{userN+=25;paintU()})};paintU();$('#cs').oninput=e=>{cq=e.target.value.trim().toLowerCase();userN=25;paintU()}}
 if(tab=='inbox')T.querySelectorAll('[data-cm]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this message?'))return;const{error}=await sb.from('contact_messages').delete().eq('id',b.dataset.cm);error?notice(error,'err'):reload()})};
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]==h)&&h!=tab){tab=h;D&&paint()}});
await load();paint();
},skRows(4));</script></body></html>
