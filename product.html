<!doctype html><html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product · Hasta-Kala</title><link rel="icon" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/store.css"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head><body><main id="app" class="max-w-6xl mx-auto p-4 w-full"></main><script>
boot(async(U,A)=>{
const id=+(new URLSearchParams(location.search).get('id')||0);
const p=id?must(await sb.from('products').select('*,shops(name,city,pincode,delivery_local_fee,delivery_far_fee,delivery_state_fee,state_days,handling_days,delivery_enabled,free_above,local_days,far_days,ships_india,cod_enabled,pickup_enabled)').eq('id',id).maybeSingle()):null;
if(!p){A.innerHTML=emptyBox('package-open','Product not available','It may have been removed, or the link is wrong.','<a class="btn b1" href="/">Back to stores</a>');return}
document.title=p.name+' · Hasta-Kala';
await Wish.load(U);
const uid=U.session?.user.id,card=r=>prodCard(r,{add:false});
const load=async()=>{
const[rv,got,more]=await Promise.all([
 sb.rpc('product_reviews',{pid:id}).then(must),
 U.session&&U.buyer?sb.from('order_items').select('id,orders!inner(user_id,status)').eq('product_id',id).eq('orders.user_id',uid).eq('orders.status','delivered').limit(1).then(must):[],
 sb.from('products').select('*').eq('shop_id',p.shop_id).neq('id',id).order('created_at',{ascending:false}).limit(12).then(must)]);
const avg=rv.length?(rv.reduce((a,r)=>a+r.rating,0)/rv.length).toFixed(1):null,mine=rv.find(r=>r.mine),gi=prodImgs(p),star=n=>rv.filter(r=>r.rating==n).length;
const rel=more.sort((a,b)=>(b.category_id==p.category_id)-(a.category_id==p.category_id)).slice(0,4),sameCat=rel.some(r=>r.category_id==p.category_id);
const form=!U.session?'<p class="mb-3 text-sm"><a class="underline" href="/login?next='+encodeURIComponent('/product?id='+id)+'">Log in</a> to review products you have bought.</p>'
 :!U.buyer?''
 :mine?'<p class="mb-3 text-sm mute">You reviewed this product. <button id="rd" class="underline text-bad">Delete my review</button></p>'
 :got.length?`<div class="mb-4"><label class="lbl" for="rt">Your rating</label><div class="flex gap-2 flex-wrap"><select id="rt" class="border rounded px-2">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} ★</option>`).join('')}</select><input id="rc" maxlength="1000" placeholder="Share what you liked (optional)" class="in flex-1" style="min-width:12rem"><button id="rs" class="btn b1">Post review</button></div><p id="rerr" class="text-bad text-sm mt-1" role="alert" hidden></p></div>`
 :'<p class="mb-3 text-sm mute">Only customers who have received this product can review it. This keeps ratings honest.</p>';
A.innerHTML=`<p class="mb-3"><a class="back" href="/shop?id=${p.shop_id}"><i data-lucide="arrow-left" class="w-4 h-4 shrink-0"></i><span>${esc(p.shops?.name||'Back to store')}</span></a></p>
<div class="grid md:grid-cols-2 gap-6 surf p-4 rounded-lg"><div class="min-w-0"><div id="gm" style="touch-action:pan-y"><img id="gi" src="${esc(safeUrl(gi[0],'/assets/icons/mark.svg'))}" alt="${esc(p.name)}" class="rounded w-full aspect-square object-cover"></div>${gi.length>1?`<div class="flex gap-2 mt-2 overflow-x-auto pb-1" role="tablist" aria-label="Product photos">${gi.map((u,i)=>`<button type="button" role="tab" data-g="${i}" class="gt ${i?'':'on'}" aria-label="Photo ${i+1} of ${gi.length}"><img src="${esc(safeUrl(u,'/assets/icons/mark.svg'))}" alt="" loading="lazy" class="rounded object-cover" style="width:64px;height:64px"></button>`).join('')}</div>`:''}</div><div><div class="flex items-start gap-2"><h1 class="text-2xl font-bold flex-1">${esc(p.name)}</h1>${U.buyer?`<span class="relative shrink-0" style="width:54px;height:54px">${Wish.heart(p.id)}</span>`:''}</div>
<p class="text-gold">${avg?'★ '+avg+' ('+rv.length+' review'+(rv.length>1?'s':'')+')':'No reviews yet'}</p><p class="text-3xl my-2">${inr(p.price)} ${p.mrp>p.price?`<s class="text-base mute">${inr(p.mrp)}</s>`:''}</p>
<p class="mb-3">${esc(p.description)}</p><p class="mb-3 ${p.stock<6?'text-bad':'text-ok'}">${p.stock<1?'Out of stock':p.stock<6?'Only '+p.stock+' left':'In stock'}</p>
${p.shops?`<div class="mb-3"><p class="text-sm mute mb-2"><i data-lucide="truck" class="w-4 h-4 inline"></i> ${esc(deliveryInfo(p.shops))}</p>${p.shops.delivery_enabled!==false?`<label class="lbl" for="dp">Check delivery to your pincode</label><div class="flex gap-2" style="max-width:22rem"><input id="dp" inputmode="numeric" maxlength="6" placeholder="Enter pincode" value="${esc(localStorage.hk_pin||'')}" class="${I}"><button type="button" id="dc" class="btn b2">Check</button></div><div id="dr" class="mt-2 text-sm" role="status"></div>`:''}</div>`:''}<div class="buybox"><label class="sr-only" for="qty">Quantity</label><input id="qty" type="number" min="1" max="${p.stock}" value="1" class="qty-in"><button id="add" class="btn b1" ${p.stock<1?'disabled':''}>Add to cart</button><button id="buy" class="btn b3" ${p.stock<1?'disabled':''}>Buy now</button></div></div></div>
<section class="surf p-4 rounded-lg mt-4"><h2 class="font-bold mb-2">Reviews</h2>${form}
${rv.length?`<div class="flex gap-4 items-center flex-wrap mb-3"><div><div class="text-3xl font-bold">${avg}</div><div class="text-gold">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</div><div class="text-xs mute">${rv.length} review${rv.length>1?'s':''}</div></div><div class="flex-1" style="min-width:12rem">${[5,4,3,2,1].map(n=>`<div class="flex items-center gap-2 text-xs"><span style="width:1.8rem">${n} ★</span><div class="flex-1 rounded surf2" style="height:8px"><div class="bar rounded" style="height:8px;width:${star(n)/rv.length*100}%"></div></div><span style="width:1.5rem;text-align:right">${star(n)}</span></div>`).join('')}</div></div>`:''}
${rv.map(r=>`<div class="border-t py-2"><div class="flex items-center gap-2 flex-wrap"><b>${esc(r.reviewer)}</b><span class="text-xs text-ok">Verified buyer</span><span class="text-gold">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><span class="text-xs mute">${esc(day(r.created_at))}</span></div>${r.comment?`<div class="mt-1">${esc(r.comment)}</div>`:''}</div>`).join('')||'<p class="text-sm mute">No reviews yet. Be the first to review after your order arrives.</p>'}</section>
${rel.length?`<section class="mt-6"><h2 class="font-bold mb-3">${sameCat?'Related products':'More from this store'}</h2><div class="pgrid">${rel.map(card).join('')}</div></section>`:''}`;
let gx=0;const showG=i=>{const k=(i+gi.length)%gi.length;$('#gi').src=safeUrl(gi[k],'/assets/icons/mark.svg');A.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',+b.dataset.g==k));showG.i=k};showG.i=0;
A.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>showG(+b.dataset.g));
if(gi.length>1){const gm=$('#gm');gm.addEventListener('touchstart',e=>{gx=e.touches[0].clientX},{passive:true});gm.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-gx;if(Math.abs(d)>40)showG(showG.i+(d<0?1:-1))})}
const qty=()=>Math.max(1,Math.min(p.stock,Math.floor(+$('#qty').value)||1));
$('#add').onclick=()=>{if(Cart.add(p,qty()))notice('Added to cart')};$('#buy').onclick=()=>{if(Cart.add(p,qty()))location='/cart'};
const dcheck=()=>{const pin=$('#dp').value.trim(),out=$('#dr');if(!/^[1-9]\d{5}$/.test(pin)){out.innerHTML='<span class="text-bad">Enter a valid 6-digit pincode.</span>';return}
 try{localStorage.hk_pin=pin}catch(e){}const r=deliveryCalc(p.shops,pin,p.price*qty());
 out.innerHTML=!r.ok?`<span class="text-bad">${esc(r.msg)}</span>`:`<div class="eta"><i data-lucide="truck" class="w-5 h-5 shrink-0"></i><span>Delivery by <b>${esc(r.eta)}</b> · ${r.fee?inr(r.fee):'<b>Free delivery</b>'}</span></div>${r.freeLeft>0?`<p class="mt-1 mute">Add ${inr(Math.ceil(r.freeLeft))} more for free delivery</p>`:''}`;icons()};
if($('#dc')){$('#dc').onclick=dcheck;$('#dp').onkeydown=e=>{if(e.key=='Enter')dcheck()};$('#qty').onchange=()=>{if($('#dr').innerHTML)dcheck()};if(/^[1-9]\d{5}$/.test($('#dp').value))dcheck()}
const hb=A.querySelector('[data-w]');if(hb)hb.onclick=e=>{e.preventDefault();Wish.toggle(U,p.id,hb)};
if($('#rs'))$('#rs').onclick=async()=>{const b=$('#rs'),er=$('#rerr');er.hidden=true;b.disabled=true;
 const{error}=await sb.from('reviews').insert({product_id:id,user_id:uid,rating:+$('#rt').value,comment:$('#rc').value.trim().slice(0,1000)||null});
 if(error){b.disabled=false;er.hidden=false;er.textContent=error.code=='23505'?'You have already reviewed this product.':error.code=='42501'?'Only customers who have received this product can review it.':msgOf(error);return}
 notice('Thanks, your review is posted.');load().catch(e=>notice(e,'err'))};
if($('#rd'))$('#rd').onclick=async()=>{if(!confirm('Delete your review?'))return;const{error}=await sb.from('reviews').delete().eq('id',mine.id);if(error)return notice(error,'err');notice('Review deleted');load().catch(e=>notice(e,'err'))};
};
await load();
},skProduct);
</script></body></html>
