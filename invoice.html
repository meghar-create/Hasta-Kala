<!doctype html><html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice · Hasta-Kala</title><meta name="robots" content="noindex"><link rel="icon" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css?v=25b"><link rel="stylesheet" href="/assets/css/store.css?v=25b"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head><body><main id="app" class="max-w-6xl mx-auto p-4 w-full"></main><script>
boot(async(U,A)=>{
if(!U.session)return location='/login?next='+encodeURIComponent(location.pathname+location.search);
const id=+(new URLSearchParams(location.search).get('id')||0);
const o=id?must(await sb.from('orders').select('*,shops(name,city,phone,address,gstin,logo_url),order_items(*)').eq('id',id).maybeSingle()):null;
if(!o){A.innerHTML=emptyBox('file-text','Invoice not found','It may belong to another account, or the link is wrong.','<a href="/orders" class="btn b1">My orders</a>');return}
const no='HK-'+String(ordNo(o)).padStart(6,'0'),sub=o.order_items.reduce((a,i)=>a+i.price*i.qty,0),a=o.address,ps=o.payment_status;
document.title='Invoice '+no;
const back=U.role=='customer'?'/orders':'/sales';
const counter=o.channel=='pos'||o.fulfilment=='counter',sh=o.shops||{};
if(counter){const R=(a,b,x)=>`<div class="rr${x?' rb':''}"><span>${a}</span>${b?`<span>${b}</span>`:''}</div>`,tq=o.order_items.reduce((a,i)=>a+i.qty,0);
const fresh=new URLSearchParams(location.search).get('new')=='1',doPrint=new URLSearchParams(location.search).get('print')=='1',logo=safeUrl(sh.logo_url);
A.innerHTML=`<div class="flex gap-2 mb-3 no-print flex-wrap">${fresh?`<a href="/pos" class="btn b1"><i data-lucide="plus" class="w-4 h-4"></i> New sale</a>`:''}<button id="pr" class="btn ${fresh?'b2':'b1'}"><i data-lucide="printer" class="w-4 h-4"></i> Print bill</button><a href="${back}" class="btn b2">${fresh?'Sales list':'← Back'}</a></div>${fresh?'<div class="note ok mb-3 no-print" role="status" style="box-shadow:none"><i data-lucide="circle-check" class="w-5 h-5 shrink-0"></i><span>Sale saved. Your bill is ready below.</span></div>':''}<p class="text-xs mute mb-2 no-print">Works with normal printers and 80 mm receipt printers. Choose “Save as PDF” to download.</p>
<article class="rcpt" aria-label="Bill ${no}">${logo?`<img id="lg" class="rc-logo" src="${esc(logo)}" alt="${esc(sh.name||'Shop')} logo">`:''}<div class="rc-c rc-name">${esc(sh.name||'')}</div>${sh.address||sh.city?`<div class="rc-c">${esc(sh.address||sh.city)}</div>`:''}${sh.phone?`<div class="rc-c">Ph: ${esc(sh.phone)}</div>`:''}${sh.gstin?`<div class="rc-c">GSTIN: ${esc(sh.gstin)}</div>`:''}
<div class="rc-hr"></div><div class="rc-c rc-b">${o.status=='cancelled'?'CANCELLED BILL':'CASH MEMO / BILL'}</div><div class="rc-hr"></div>
${R('Bill no: '+no,'')}${R(esc(when(o.created_at)),'')}${R('Customer: '+esc(o.customer_name||'Walk-in'),'')}${o.sold_by_name?R('Billed by: '+esc(o.sold_by_name),''):''}<div class="rc-hr"></div>
<table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amt</th></tr></thead><tbody>${o.order_items.map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${i.qty}</td><td class="r">${inr(i.price)}</td><td class="r">${inr(i.price*i.qty)}</td></tr>`).join('')}</tbody></table><div class="rc-hr"></div>
${R('Items: '+o.order_items.length+' · Qty: '+tq,'')}${R('Subtotal',inr(sub))}${+o.discount?R('Discount','−'+inr(o.discount)):''}${R('TOTAL',inr(o.total),1)}${R('Paid by',esc(o.payment_method||'Cash'))}
<div class="rc-hr"></div><div class="rc-c">Thank you! Visit again.</div><div class="rc-c rc-s">Goods once sold will not be taken back unless defective.</div><div class="rc-c rc-s">Billed via Hasta·Kala</div></article>`;
$('#pr').onclick=()=>window.print();icons();
 if(doPrint){const go=()=>setTimeout(()=>window.print(),250),im=$('#lg');im&&!im.complete?(im.onload=go,im.onerror=go):go()}return}
A.innerHTML=`<div class="flex gap-2 mb-3 no-print flex-wrap"><a href="${back}" class="btn b2">← Back</a><button id="pr" class="btn b1"><i data-lucide="download" class="w-4 h-4"></i> Download / Print (PDF)</button></div><p class="text-xs mute mb-2 no-print">In the print window choose “Save as PDF” as the destination to download it.</p>
<article class="inv" aria-label="Invoice ${no}"><div class="flex justify-between flex-wrap gap-4 mb-6"><div>${safeUrl(o.shops?.logo_url)?`<img class="inv-logo" src="${esc(safeUrl(o.shops.logo_url))}" alt="${esc(o.shops?.name||'Shop')} logo">`:''}<div style="font-family:Cinzel,Georgia,serif;font-size:1.4rem;letter-spacing:.12em">${safeUrl(o.shops?.logo_url)?esc((o.shops?.name||'').toUpperCase()):'HASTA · KALA'}</div><div style="color:#555;font-size:.85rem">${safeUrl(o.shops?.logo_url)?'via Hasta·Kala':'Handcrafted Heritage'}</div></div><div class="r" style="text-align:right"><div style="font-size:1.5rem;font-weight:700">INVOICE</div><div>${no}</div><div style="color:#555;font-size:.85rem">${esc(day(o.created_at))}</div></div></div>
${o.status=='cancelled'?'<div style="border:2px solid #b91c1c;color:#b91c1c;font-weight:700;padding:.4rem .8rem;margin-bottom:1rem;display:inline-block">CANCELLED</div>':''}
<div class="grid sm:grid-cols-2 gap-6 mb-6 text-sm"><div><div style="font-weight:700;margin-bottom:.2rem">Sold by</div><b>${esc(o.shops?.name)}</b><br>${o.shops?.address?esc(o.shops.address):esc(o.shops?.city)}${o.shops?.phone?'<br>☎ '+esc(o.shops.phone):''}${o.shops?.gstin?'<br>GSTIN: '+esc(o.shops.gstin):''}</div><div><div style="font-weight:700;margin-bottom:.2rem">${a&&a.pickup?'Billed to (store pickup)':o.channel=='pos'?'Billed to (in-store sale)':'Billed / delivered to'}</div>${a&&a.pickup?`${esc(a.name)}<br>☎ ${esc(a.phone)}<br>Collect from the store`:a?`${esc(a.name)}<br>${esc(a.address)}<br>${esc(a.city)} ${esc(a.pincode)}<br>☎ ${esc(a.phone)}`:esc(o.customer_name||'Walk-in customer')}</div></div>
<table><thead><tr><th>Item</th><th class="r">Price</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>${o.order_items.map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${inr(i.price)}</td><td class="r">${i.qty}</td><td class="r">${inr(i.price*i.qty)}</td></tr>`).join('')}</tbody></table>
<div style="margin-left:auto;max-width:18rem;margin-top:1rem"><div class="flex justify-between"><span>Subtotal</span><span>${inr(sub)}</span></div>${+o.discount?`<div class="flex justify-between"><span>${o.coupon_code?'Coupon '+esc(o.coupon_code):'Discount'}</span><span>−${inr(o.discount)}</span></div>`:''}${o.fulfilment=='delivery'?`<div class="flex justify-between"><span>Delivery</span><span>${+o.delivery_fee?inr(o.delivery_fee):'Free'}</span></div>`:''}<div class="flex justify-between" style="font-weight:700;font-size:1.15rem;border-top:2px solid #111;margin-top:.4rem;padding-top:.4rem"><span>Total (INR)</span><span>${inr(o.total)}</span></div></div>
${o.courier||o.tracking_no?`<p style="margin-top:1rem;font-size:.85rem;color:#444">Shipped via ${esc(o.courier||'courier')}${o.tracking_no?' · Tracking: '+esc(o.tracking_no):''}</p>`:''}<p style="margin-top:1.5rem;font-size:.85rem;color:#444">Payment: ${esc(o.payment_method||'')} · ${ps=='paid'?'Paid':ps=='cod'?(o.fulfilment=='pickup'?'To be paid at the store':'To be paid on delivery'):ps=='pending'?'Payment pending':esc(ps)}</p>
<p style="margin-top:2rem;font-size:.75rem;color:#666">This is a computer-generated invoice and needs no signature. Questions about this order? Contact the store or write to us via the Contact page.</p></article>`;
$('#pr').onclick=()=>window.print()},skRows(2));
</script></body></html>
