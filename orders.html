<!doctype html><html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders · Hasta-Kala</title><meta name="robots" content="noindex"><link rel="icon" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/store.css"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head><body><main id="app" class="max-w-6xl mx-auto p-4 w-full"></main><script>
boot(async(U,A)=>{
if(!U.session)return location='/login?next=/orders';
if(!U.buyer){A.innerHTML=emptyBox('lock','Orders are for customer accounts','Shop owners and staff manage orders on the Sales page.','<a href="/sales" class="btn b1">Go to Sales</a>');return}
const MSG={placed:['Order placed. The store will confirm it shortly.','ok'],paid:['Payment successful. Thank you!','ok'],cancelled:['Your order has been cancelled.'+' If you had paid online, the refund will follow our refund policy.','ok'],unpaid:['Your order is placed but not paid yet. Use “Pay now” within 60 minutes or it will be cancelled.','ok'],payfail:['The payment did not go through. Your order is saved: use “Pay now” within 60 minutes to try again.','err']};
const m=MSG[new URLSearchParams(location.search).get('msg')];if(m)notice(m[0],m[1]);
A.innerHTML=`<h1 class="text-xl font-bold mb-3">My Orders</h1><div id="box">${skRows(3)}</div>`;const box=$('#box');
const lines=o=>`${o.order_items.map(i=>`<div class="flex justify-between"><span>${esc(i.name)} × ${i.qty}</span><span>${inr(i.price*i.qty)}</span></div>`).join('')}${+o.discount?`<div class="flex justify-between text-ok"><span>Coupon ${esc(o.coupon_code)}</span><span>−${inr(o.discount)}</span></div>`:''}${+o.delivery_fee?`<div class="flex justify-between"><span>Delivery</span><span>${inr(o.delivery_fee)}</span></div>`:''}<div class="flex justify-between font-bold mt-1 border-t pt-1"><span>Total</span><span>${inr(o.total)}</span></div>`;
await paged({box,size:10,
 load:(a,b)=>sb.from('orders').select('*,shops(*),order_items(*),order_events(status,created_at)',{count:'exact'}).eq('user_id',U.session.user.id).order('created_at',{ascending:false}).range(a,b),
 card:o=>`<div class="surf rounded-lg p-4 mb-3 ord-card"><div class="ord-head"><b class="ord-title">Order #${ordNo(o)} · ${esc(o.shops?.name)}</b><span class="px-2 t-warn rounded ord-status">${esc(o.status)}</span></div>
<div class="text-sm mute ord-meta">${esc(when(o.created_at))} · <span class="px-1 rounded ${ordType(o)[1]}">${ordType(o)[0]}</span> · <span class="px-1 rounded ${payTag(o)[1]||''}">${esc(payTag(o)[0])}</span></div>${timeline(o)}${orderEta(o)}${shipInfo(o)}
<div class="text-sm mt-2">${lines(o)}</div>${o.address&&o.address.pickup?`<div class="text-sm mt-2"><i data-lucide="map-pin" class="w-4 h-4 inline"></i> ${o.status=='packed'?'<b>Ready for pickup</b> at':'Collect from'} <b>${esc(o.shops?.name)}</b>${o.shops?.pickup_address||o.shops?.city?', '+esc(o.shops.pickup_address||o.shops.city):''}</div>`:o.address?`<div class="text-xs mute mt-2">Deliver to ${esc(o.address.name)}, ${esc(o.address.address)}, ${esc(o.address.city)} ${esc(o.address.pincode)}</div>`:''}
<div class="ord-actions">${o.payment_status=='pending'&&o.status!='cancelled'?`<button data-pay="${o.id}" class="${B}">Pay now</button>`:''}${o.status=='placed'?`<button data-cancel="${o.id}" class="btn b2">Cancel order</button>`:''}${o.status!='cancelled'?`<a href="/invoice?id=${o.id}" class="btn b2"><i data-lucide="download" class="w-4 h-4"></i> Invoice</a>`:''}</div></div>`,
 none:emptyBox('package','No orders yet','When you place an order you can follow it here, from packed to delivered.','<a href="/" class="btn b1">Start shopping</a>')});
box.addEventListener('click',async e=>{const c=e.target.closest('[data-cancel]');if(c){if(!confirm('Cancel this order? This cannot be undone.'))return;c.disabled=true;const{error}=await sb.rpc('cancel_order',{oid:+c.dataset.cancel});if(error){c.disabled=false;return notice(error,'err')}location='/orders?msg=cancelled';return}
 const b=e.target.closest('[data-pay]');if(!b)return;b.disabled=true;const oid=+b.dataset.pay;
 try{const ok=await pay('create-order',{order_id:oid},'verify-payment',{order_id:oid},'Order #'+oid,U.session.user.email);location=ok?'/orders?msg=paid':'/orders?msg=unpaid'}catch(x){b.disabled=false;notice(x,'err')}});
},skRows(3));
</script></body></html>
