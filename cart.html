<!doctype html><html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart · Hasta-Kala</title><meta name="robots" content="noindex"><link rel="icon" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/store.css"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head><body><main id="app" class="max-w-6xl mx-auto p-4 w-full"></main><script>
boot(async(U,A)=>{
if(U.session&&!U.buyer){A.innerHTML=emptyBox('lock','Carts are for customer accounts','Sign in with a customer account to place orders.','<a href="/" class="btn b1">Back to stores</a>');return}
const addrs=U.session?must(await sb.from('addresses').select('*').order('is_default',{ascending:false}).order('id')):[];
const d0=addrs[0];let cpn=null,busy=false;
const shopRow=Cart.get().length&&localStorage.hk_shop?must(await sb.from('shops').select('name,city,pickup_enabled,pickup_address,pincode,delivery_local_fee,delivery_far_fee,delivery_state_fee,state_days,handling_days,delivery_enabled,free_above,local_days,far_days,ships_india,cod_enabled').eq('id',localStorage.hk_shop).maybeSingle()):null;
const F={name:d0?.name||U.pf?.full_name||'',phone:d0?.phone||U.pf?.phone||'',address:d0?.address||'',city:d0?.city||'',pincode:d0?.pincode||'',pm:'COD',code:'',save:!addrs.length,ful:'delivery'};
if(shopRow&&shopRow.delivery_enabled===false&&shopRow.pickup_enabled)F.ful='pickup';
if(!F.pincode&&localStorage.hk_pin)F.pincode=localStorage.hk_pin;
let syncMsg=[];
/* Re-check every cart line against the live product list, so a price or stock change made by the shop is never missed. */
const syncCart=async()=>{const c=Cart.get();if(!c.length)return[];const{data}=await sb.from('products').select('id,name,price,stock,image_url,images').in('id',c.map(i=>i.id));
 const m=new Map((data||[]).map(p=>[+p.id,p])),msgs=[],n=[];
 for(const i of c){const p=m.get(+i.id);if(!p||p.stock<1){msgs.push((i.name||'An item')+' is no longer available and was removed');continue}
  let q=i.qty;if(q>p.stock){q=p.stock;msgs.push(p.name+': only '+p.stock+' left, quantity reduced')}
  if(+p.price!==+i.price)msgs.push(p.name+': price is now '+inr(p.price)+' (was '+inr(i.price)+')');
  n.push({...i,name:p.name,price:+p.price,image_url:p.images?.[0]||p.image_url,stock:p.stock,qty:q})}
 if(msgs.length||n.length!=c.length)Cart.set(n);return msgs};
const FIELDS=[['name','Full name','name'],['phone','Phone (10 digits)','tel'],['address','Address','street-address'],['city','City','address-level2'],['pincode','Pincode','postal-code']];
const render=()=>{const c=Cart.get(),sub=c.reduce((a,i)=>a+i.price*i.qty,0),disc=cpn?.discount||0,pk=(F.ful=='pickup'||shopRow?.delivery_enabled===false)&&!!shopRow?.pickup_enabled,pinOk=/^[1-9]\d{5}$/.test(F.pincode.trim()),dv=shopRow&&pinOk&&!pk?deliveryCalc(shopRow,F.pincode.trim(),sub):null,fee=dv?.ok?dv.fee:0;
if(shopRow&&!shopRow.cod_enabled&&!pk&&F.pm=='COD')F.pm='Online';
if(!c.length){A.innerHTML=emptyBox('shopping-bag','Your cart is empty','Pick a store and add something handcrafted.','<a class="btn b1" href="/">Choose a store</a>');return}
A.innerHTML=`<h1 class="text-xl font-bold mb-3">Your cart</h1>${syncMsg.length?`<div class="note mb-3" role="status" style="box-shadow:none"><i data-lucide="info" class="w-5 h-5 shrink-0"></i><span>${syncMsg.map(esc).join('. ')}</span></div>`:''}<div class="grid md:grid-cols-3 gap-4"><div class="md:col-span-2 surf rounded-2xl cr-list" style="align-self:start">${c.map(i=>`<div class="cr"><img src="${esc(safeUrl(i.image_url,'/assets/icons/mark.svg'))}" alt="" class="cr-img"><div class="cr-info"><div class="cr-name">${esc(i.name)}</div><div class="cr-unit">${inr(i.price)} each</div><div class="cr-foot"><div class="step" role="group" aria-label="Quantity for ${esc(i.name)}"><button type="button" data-s="-1" data-for="${esc(i.id)}" aria-label="Decrease quantity" ${i.qty<=1?'disabled':''}><i data-lucide="minus"></i></button><input id="q${esc(i.id)}" type="number" inputmode="numeric" min="1" ${i.stock?`max="${i.stock}"`:''} value="${i.qty}" data-q="${esc(i.id)}" aria-label="Quantity"><button type="button" data-s="1" data-for="${esc(i.id)}" aria-label="Increase quantity" ${i.stock&&i.qty>=i.stock?'disabled':''}><i data-lucide="plus"></i></button></div><b class="cr-total">${inr(i.price*i.qty)}</b><button type="button" data-r="${esc(i.id)}" class="cr-del" aria-label="Remove ${esc(i.name)} from cart" title="Remove"><i data-lucide="trash-2"></i></button></div></div></div>`).join('')}</div>
<div class="surf rounded-lg p-4 space-y-2">${shopRow&&shopRow.delivery_enabled===false?'<div class="note mb-1" style="box-shadow:none"><i data-lucide="store" class="w-5 h-5 shrink-0"></i><span>This store offers <b>store pickup only</b>.</span></div>':''}${shopRow?.pickup_enabled&&shopRow.delivery_enabled!==false?`<div class="grid grid-cols-2 gap-2" role="radiogroup" aria-label="How would you like to receive your order"><label class="ful ${!pk?'on':''}"><input type="radio" name="ful" value="delivery" ${!pk?'checked':''} class="sr-only"><b>Home delivery</b><span class="text-xs mute">We ship it to you</span></label><label class="ful ${pk?'on':''}"><input type="radio" name="ful" value="pickup" ${pk?'checked':''} class="sr-only"><b>Store pickup</b><span class="text-xs mute">Collect it, no delivery fee</span></label></div>`:''}
<h2 class="font-bold">${pk?'Your details':'Delivery address'}</h2>${pk?`<p class="text-sm"><i data-lucide="map-pin" class="w-4 h-4 inline"></i> Collect from <b>${esc(shopRow.name)}</b>${shopRow.pickup_address||shopRow.city?', '+esc(shopRow.pickup_address||shopRow.city):''}. We mark your order <b>Ready for pickup</b> when it is packed. You can pay online or at the store.</p>`:''}
${addrs.length&&!pk?`<label class="lbl" for="sa">Use a saved address</label><select id="sa" class="${I}"><option value="">Enter a different address</option>${addrs.map(a=>`<option value="${a.id}" ${F.address==a.address&&F.pincode==a.pincode?'selected':''}>${esc(a.label)} · ${esc(a.address)}, ${esc(a.city)}</option>`).join('')}</select>`:''}
${(pk?FIELDS.filter(f=>f[0]=='name'||f[0]=='phone'):FIELDS).map(([k,l,ac])=>`<div><label class="sr-only" for="f_${k}">${l}</label><input id="f_${k}" data-f="${k}" autocomplete="${ac}" placeholder="${l}" ${k=='city'?'list="kcities"':''} value="${esc(F[k])}" class="${I}"></div>`).join('')}<datalist id="kcities">${CITIES.map(c=>`<option value="${c.n}">`).join('')}</datalist>
${U.session&&addrs.length<10&&!pk?`<label class="flex gap-2 items-center text-sm"><input type="checkbox" id="sv" ${F.save?'checked':''}> Save this address to my profile</label>`:''}
<label class="lbl" for="pm">Payment</label><select id="pm" class="${I}">${shopRow&&!shopRow.cod_enabled&&!pk?'':`<option value="COD" ${F.pm=='COD'?'selected':''}>${pk?'Pay at the store':'Cash on Delivery'}</option>`}<option value="Online" ${F.pm=='Online'?'selected':''}>Pay online (UPI / Card / Netbanking)</option></select>
<div><label class="lbl" for="cc">Coupon code</label><div class="flex gap-2"><input id="cc" value="${esc(cpn?.code||F.code)}" ${cpn?'readonly':''} placeholder="e.g. WELCOME10" class="${I}" style="text-transform:uppercase"><button type="button" id="ca" class="btn b2">${cpn?'Remove':'Apply'}</button></div><p id="cm" class="text-sm mt-1 ${cpn?'text-ok':'text-bad'}" role="status">${cpn?esc(cpn.code)+' applied: you save '+inr(disc):''}</p></div>
<div class="border-t pt-2 text-sm"><div class="flex justify-between"><span>Subtotal</span><span>${inr(sub)}</span></div>${disc?`<div class="flex justify-between text-ok"><span>Coupon discount</span><span>−${inr(disc)}</span></div>`:''}
${shopRow&&pk?'<div class="flex justify-between"><span>Store pickup</span><span>Free</span></div>':''}${shopRow&&!pk?`<div class="flex justify-between"><span>Delivery${dv?.ok&&dv.days?` <span class="mute">(${esc(dv.days)} days)</span>`:''}</span><span>${!pinOk?'<span class="mute">Enter pincode</span>':!dv.ok?'<span class="text-bad">Not available</span>':fee?inr(fee):'Free'}</span></div>`:''}${dv&&!dv.ok?`<p class="text-bad mt-1" role="alert">${esc(dv.msg)}</p>`:''}${dv?.ok&&dv.eta?`<div class="eta mt-2"><i data-lucide="truck" class="w-5 h-5 shrink-0"></i><span>Estimated delivery <b>${esc(dv.eta)}</b> <span class="text-xs">(${esc(ZONES[dv.zone].n)})</span></span></div>`:''}${dv?.ok&&dv.freeLeft>0?`<div class="mt-2"><p>${I18N.t('Add {0} more to get {1}','<b>'+inr(Math.ceil(dv.freeLeft))+'</b>','<b>'+I18N.t('free delivery')+'</b>')}</p><div class="prog mt-1"><i style="width:${Math.min(100,sub/shopRow.free_above*100)}%"></i></div></div>`:''}${dv?.ok&&shopRow.free_above&&dv.fee==0&&sub>=+shopRow.free_above?'<p class="text-ok mt-1">You unlocked free delivery.</p>':''}</div>
<p class="text-xl font-bold flex justify-between"><span>Total</span><span>${inr(sub-disc+fee)}</span></p>
<div id="pe" class="note err" role="alert" hidden style="box-shadow:none"><i data-lucide="circle-alert" class="w-5 h-5 shrink-0"></i><span></span></div>
<button id="po" class="${B} w-full">Place order</button></div></div>`;
const err=(m,f)=>{const e=$('#pe');e.hidden=!m;e.lastElementChild.textContent=m||'';A.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('fld-err',!!m&&x.dataset.f==f));if(m){e.scrollIntoView({block:'nearest'});if(f)$('#f_'+f).focus()}};
A.querySelectorAll('[data-f]').forEach(e=>e.oninput=()=>{F[e.dataset.f]=e.value;err('')});
A.querySelectorAll('[name=ful]').forEach(r=>r.onchange=e=>{F.ful=e.target.value;err('');render()});
$('#pm').onchange=e=>{F.pm=e.target.value};$('#f_pincode')&&($('#f_pincode').onchange=()=>{try{localStorage.hk_pin=F.pincode.trim()}catch(e){}render()});$('#sv')&&($('#sv').onchange=e=>{F.save=e.target.checked});
$('#sa')&&($('#sa').onchange=e=>{const a=addrs.find(x=>x.id==e.target.value);if(a)Object.assign(F,{name:a.name,phone:a.phone,address:a.address,city:a.city,pincode:a.pincode,save:false});else Object.assign(F,{address:'',city:'',pincode:''});render()});
$('#cc').oninput=e=>{F.code=e.target.value};
$('#ca').onclick=async()=>{if(cpn){cpn=null;F.code='';return render()}if(!U.session)return location='/login?next=/cart';const code=$('#cc').value.trim();if(!code){$('#cm').className='text-sm mt-1 text-bad';$('#cm').textContent='Enter a coupon code.';return}
 $('#ca').disabled=true;const{data,error}=await sb.rpc('check_coupon',{sid:+localStorage.hk_shop,items:Cart.get().map(i=>({id:i.id,qty:i.qty})),cd:code});
 if(error){$('#ca').disabled=false;$('#cm').className='text-sm mt-1 text-bad';$('#cm').textContent=msgOf(error);return}cpn={code:code.toUpperCase(),discount:+data.discount};render()};
A.querySelectorAll('[data-q]').forEach(e=>e.onchange=()=>{const c=Cart.get(),it=c.find(i=>i.id==e.dataset.q);it.qty=Math.max(1,Math.min(it.stock||1e9,Math.floor(+e.value)||1));Cart.set(c);cpn=null;render()});
A.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{const i=A.querySelector(`[data-q="${e.dataset.for}"]`);i.value=(+i.value||1)+ +e.dataset.s;i.dispatchEvent(new Event('change'))});
A.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{Cart.set(Cart.get().filter(i=>i.id!=e.dataset.r));cpn=null;render()});
$('#po').onclick=async()=>{if(busy)return;if(!U.session)return location='/login?next=/cart';
 const a={name:F.name.trim(),phone:F.phone.replace(/[\s-]/g,'').replace(/^\+?91/,''),address:F.address.trim(),city:F.city.trim(),pincode:F.pincode.trim()};
 for(const[k,l]of (pk?FIELDS.slice(0,2):FIELDS))if(!a[k])return err('Please enter your '+l.replace(/ \(.*\)/,'').toLowerCase()+'.',k);
 if(!/^[6-9]\d{9}$/.test(a.phone))return err('Enter a valid 10-digit mobile number.','phone');
 if(!pk&&!/^[1-9]\d{5}$/.test(a.pincode))return err('Enter a valid 6-digit pincode.','pincode');
 if(dv&&!dv.ok)return err(dv.msg,'pincode');
 err('');busy=true;$('#po').disabled=true;$('#po').textContent='Placing order…';
 const{data:id,error}=await sb.rpc('place_order',{sid:+localStorage.hk_shop,items:Cart.get().map(i=>({id:i.id,qty:i.qty})),addr:a,pay:F.pm,cpn:cpn?.code||null,ful:pk?'pickup':'delivery'});
 if(error){busy=false;$('#po').disabled=false;$('#po').textContent='Place order';return err(msgOf(error))}
 if(F.save&&$('#sv')){await sb.from('addresses').insert({label:'Home',...a,is_default:!addrs.length})}   // best effort: the order is already placed
 Cart.set([]);let go='placed';
 if(F.pm=='Online'){try{go=(await pay('create-order',{order_id:id},'verify-payment',{order_id:id},'Order #'+id,U.session.user.email))?'paid':'unpaid'}catch(e){go='payfail'}}
 location='/orders?msg='+go}};
syncMsg=await syncCart();render()},skRows(2));
</script></body></html>
