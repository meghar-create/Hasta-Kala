<!doctype html><html lang="en" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop settings · Hasta-Kala</title><link rel="icon" href="/assets/icons/favicon.svg"><meta name="theme-color" content="#14181D"><meta name="color-scheme" content="light dark"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png"><script src="/assets/vendor/lucide.min.js"></script><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/store.css"><link rel="stylesheet" href="/assets/css/tailwind.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/i18n-dict.js"></script><script src="/assets/js/i18n-extra.js"></script><script src="/assets/js/i18n-demo.js"></script><script src="/assets/js/i18n.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/lens.js"></script></head><body><main id="app" class="max-w-6xl mx-auto p-4 w-full"></main><script>
boot(async(U,A)=>{if(!guard(U,['owner']))return;
let logoFresh=null;   /* a logo uploaded in this visit but not saved yet */
const draw0=async()=>{
const[{data:sh},{data:tm},{data:cp}]=await Promise.all([sb.from('shops').select('*').eq('id',U.shop).single(),sb.from('profiles').select('*').eq('shop_id',U.shop).eq('role','staff'),sb.from('coupons').select('*').eq('shop_id',U.shop).order('id',{ascending:false})]).then(a=>a.map(chk));
let logo=logoFresh||sh.logo_url||'';
A.innerHTML=`<h1 class="text-xl font-bold mb-3">Shop settings</h1>
<div class="grid md:grid-cols-2 gap-4 mb-4"><div class="surf rounded-lg p-4 space-y-2"><h2 class="font-bold">Shop profile</h2>
<div><span class="lbl">Shop logo</span><div class="flex gap-3 items-center flex-wrap"><div id="lp" class="surf2 rounded flex items-center justify-center overflow-hidden" style="width:84px;height:84px">${safeUrl(logo)?`<img src="${esc(safeUrl(logo))}" alt="Shop logo" style="max-width:100%;max-height:100%;object-fit:contain">`:'<i data-lucide="image" class="w-6 h-6 mute"></i>'}</div><div class="flex gap-2 flex-wrap"><label class="btn b2 cursor-pointer"><input id="lf" type="file" accept="image/jpeg,image/png,image/webp" class="sr-only"><i data-lucide="upload" class="w-4 h-4"></i> Upload logo</label>${logo?'<button type="button" id="lr" class="btn b2">Remove</button>':''}</div></div>
<p id="lm" class="text-xs mute mt-1" role="status">JPG, PNG or WebP. It is shown on your store and printed at the top of every bill.</p>
<details class="mt-1"><summary class="text-xs mute cursor-pointer">Or paste a logo link instead</summary><input id="l" value="${esc(logo)}" placeholder="https://… (logo link)" class="${I} mt-1"></details></div>
<div><label class="lbl" for="n">Shop name</label><input id="n" value="${esc(sh.name)}" class="${I}"></div><div><label class="lbl" for="c">City</label><select id="c" class="${I}">${cityOpts(sh.city)}</select></div><div><label class="lbl" for="d">Description</label><input id="d" value="${esc(sh.description)}" placeholder="Description" class="${I}"></div>
<p class="text-xs mute pt-1">Printed on every bill you give to customers:</p><input id="sp_ph" value="${esc(sh.phone)}" maxlength="20" inputmode="tel" placeholder="Shop phone" aria-label="Shop phone" class="${I}"><input id="sp_ad" value="${esc(sh.address)}" maxlength="300" placeholder="Shop address (street, area, city, pincode)" aria-label="Shop address" class="${I}"><input id="sp_gs" value="${esc(sh.gstin)}" maxlength="20" placeholder="GSTIN (optional)" aria-label="GSTIN" class="${I}" style="text-transform:uppercase"><div class="flex gap-2 flex-wrap"><button id="sv" class="${B}">Save profile</button></div></div>
<div class="surf rounded-lg p-4 space-y-2"><h2 class="font-bold">Staff</h2><p class="text-xs mute">Create a login for each staff member and share the email and password with them. They sign in at /staff-login. Every counter bill shows who made it.</p>${tm.map(t=>`<div class="flex justify-between gap-2 items-center"><span class="min-w-0" style="overflow-wrap:anywhere"><b>${esc(t.full_name||'Staff')}</b><span class="block text-xs mute">${esc(t.email)}</span></span><button data-r="${t.id}" class="text-bad shrink-0">Remove</button></div>`).join('')||'<p class="text-sm mute">No staff yet.</p>'}<div class="grid gap-2 sm:grid-cols-3"><input id="sn" placeholder="Staff name" class="${I}" autocomplete="off"><input id="se" type="email" placeholder="staff@email.com" class="${I}" autocomplete="off"><input id="sp" type="text" placeholder="Password (min 8)" class="${I}" autocomplete="off"></div><button id="sa" class="${B}">Create staff account</button></div></div>
<div class="surf rounded-lg p-4 mb-4"><h2 class="font-bold mb-1">Coupons</h2><p class="text-xs mute mb-2">Customers enter the code at checkout. Each customer can use a code once, one code per order.</p>
<form id="cf" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3" novalidate><input id="cc_code" placeholder="CODE (e.g. DIWALI10)" aria-label="Coupon code" maxlength="20" class="${I}" style="text-transform:uppercase"><select id="cc_kind" aria-label="Discount type" class="${I}"><option value="percent">Percent off</option><option value="flat">Flat ₹ off</option></select><input id="cc_val" type="number" min="1" placeholder="Value" aria-label="Discount value" class="${I}"><input id="cc_min" type="number" min="0" placeholder="Min order ₹" aria-label="Minimum order" class="${I}"><input id="cc_max" type="number" min="1" placeholder="Max discount ₹ (optional)" aria-label="Maximum discount" class="${I}"><input id="cc_lim" type="number" min="1" placeholder="Total uses (optional)" aria-label="Usage limit" class="${I}"><input id="cc_exp" type="date" aria-label="Expiry date (optional)" class="${I}"><button class="${B}">Create coupon</button><p id="cc_err" class="text-bad text-sm col-span-full" role="alert" hidden></p></form>
${cp.length?`<div class="overflow-x-auto"><table class="w-full text-sm"><tr class="text-left"><th>Code</th><th>Offer</th><th>Used</th><th>Expires</th><th>Status</th><th></th></tr>${cp.map(c=>`<tr class="border-t"><td><b>${esc(c.code)}</b></td><td>${c.kind=='percent'?c.value+'% off':inr(c.value)+' off'}${+c.min_order?' · min '+inr(c.min_order):''}${c.max_discount?' · up to '+inr(c.max_discount):''}</td><td>${c.used_count}${c.usage_limit?' / '+c.usage_limit:''}</td><td>${c.expires_at?esc(day(c.expires_at)):'—'}</td><td>${c.expires_at&&new Date(c.expires_at)<new Date()?'Expired':c.active?'Active':'Paused'}</td><td class="space-x-2"><button data-ct="${c.id}" data-on="${c.active?1:0}" class="underline">${c.active?'Pause':'Resume'}</button><button data-cd="${c.id}" class="text-bad underline">Delete</button></td></tr>`).join('')}</table></div>`:'<p class="text-sm mute">No coupons yet. Create one above to run an offer.</p>'}</div>`;
icons();
$('#lf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const m=$('#lm');m.textContent='Uploading…';m.className='text-xs mute mt-1';
 try{const old=logoFresh;logoFresh=await uploadShopLogo(U.shop,f);old&&dropStoredImage(old);
  const{error}=await sb.from('shops').update({logo_url:logoFresh}).eq('id',U.shop);if(error)throw error;
  if(sh.logo_url&&sh.logo_url!=logoFresh)dropStoredImage(sh.logo_url);logoFresh=null;notice('Logo saved. It will be printed on your bills.');draw()}catch(x){m.textContent=msgOf(x);m.className='text-xs text-bad mt-1'}};
$('#lr')&&($('#lr').onclick=async()=>{if(!confirm('Remove the logo?'))return;const{error}=await sb.from('shops').update({logo_url:null}).eq('id',U.shop);if(error)return notice(error,'err');dropStoredImage(sh.logo_url);logoFresh=null;draw()});
$('#sv').onclick=async()=>{const lk=$('#l').value.trim();if(lk&&!/^https?:\/\//i.test(lk))return notice('The logo link must start with https://','err');
 const{error}=await sb.from('shops').update({name:$('#n').value.trim()||sh.name,city:$('#c').value,description:$('#d').value,logo_url:lk||null,phone:$('#sp_ph').value.trim()||null,address:$('#sp_ad').value.trim()||null,gstin:$('#sp_gs').value.trim().toUpperCase()||null}).eq('id',U.shop);error?notice(error,'err'):notice('Shop profile saved')};
$('#sa').onclick=async()=>{const b=$('#sa');b.disabled=true;try{await api('create-staff',{name:$('#sn').value,email:$('#se').value,password:$('#sp').value});notice('Staff account created. Share the email and password with them.');draw()}catch(e){notice(e,'err');b.disabled=false}};
$('#cf').onsubmit=async ev=>{ev.preventDefault();const er=$('#cc_err');er.hidden=true;const code=$('#cc_code').value.trim().toUpperCase(),kind=$('#cc_kind').value,value=+$('#cc_val').value;
const bad=!/^[A-Z0-9_-]{3,20}$/.test(code)?'Code must be 3 to 20 letters, numbers, - or _.':!(value>0)?'Enter the discount value.':kind=='percent'&&value>100?'Percent cannot be more than 100.':'';
if(bad){er.hidden=false;er.textContent=bad;return}
const{error}=await sb.from('coupons').insert({shop_id:U.shop,code,kind,value,min_order:+$('#cc_min').value||0,max_discount:+$('#cc_max').value||null,usage_limit:Math.floor(+$('#cc_lim').value)||null,expires_at:$('#cc_exp').value?new Date($('#cc_exp').value+'T23:59:59').toISOString():null});
if(error){er.hidden=false;er.textContent=error.code=='23505'?'You already have a coupon with this code.':msgOf(error);return}notice('Coupon '+code+' created');draw()};
A.querySelectorAll('[data-ct]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('coupons').update({active:b.dataset.on!='1'}).eq('id',b.dataset.ct);error?notice(error,'err'):draw()});
A.querySelectorAll('[data-cd]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this coupon?'))return;const{error}=await sb.from('coupons').delete().eq('id',b.dataset.cd);error?notice(error,'err'):draw()});
A.querySelectorAll('[data-r]').forEach(e=>e.onclick=async()=>{if(!confirm('Remove this staff member? Their bills stay in your sales history.'))return;const{error}=await sb.rpc('remove_staff',{uid:e.dataset.r});error?notice(error,'err'):draw()})};
const draw=()=>draw0().catch(e=>{A.innerHTML=errBox(e,{home:false})});await draw0();
},skRows(4));</script></body></html>
